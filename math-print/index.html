<style>
  :root{
    --bg:#f4f7fb; --panel:#fff; --line:#dfe6ef; --ink:#1f2a37;
    --muted:#6b7785; --accent:#2f6fed; --accent2:#e8f0ff; --ok:#16a34a;
    --wood:#e6c188; --wood2:#d8ad6e; --wood-dark:#b98a4a;
    --warn:#f0a63e; --weak:#ec6a6a;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
       background:var(--bg); color:var(--ink); line-height:1.5; -webkit-text-size-adjust:100%;}
  *{-webkit-tap-highlight-color:transparent}
  .wrap{max-width:920px;margin:0 auto;padding:18px 16px 60px}
  h1{font-size:22px;margin:6px 0 2px;display:flex;align-items:center;gap:8px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 16px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
         padding:16px;box-shadow:0 1px 3px rgba(20,40,80,.05);margin-bottom:16px}
  .row{margin-bottom:16px}.row:last-child{margin-bottom:0}
  label.tag{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;
        padding:10px 18px;font-size:16px;cursor:pointer;user-select:none;transition:.12s}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .gradechips .chip{min-width:64px;text-align:center;font-weight:700}

  button.go{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:14px 24px;
            font-size:17px;font-weight:800;cursor:pointer}
  button.go:disabled{background:#b8c6e6;cursor:not-allowed}
  button.ghost{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px 18px;font-size:15px;cursor:pointer}
  button:active{transform:translateY(1px)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .foot{color:var(--muted);font-size:12px;margin-top:22px;line-height:1.8}
  .foot a{color:var(--accent);text-decoration:none} .foot a:hover{text-decoration:underline}

  /* ===== ステップ選択（1つずつ） ===== */
  .step-title{font-size:19px;font-weight:800;margin:2px 0 14px}
  .opts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .optbtn{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:20px 14px;
          font-size:18px;font-weight:800;cursor:pointer;text-align:center;transition:.12s;line-height:1.3;color:var(--ink)}
  .optbtn:hover{border-color:var(--accent);background:var(--accent2)}
  .optbtn small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:5px}
  .optbtn:disabled{cursor:not-allowed;opacity:.4}
  .crumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .crumb{background:var(--accent2);color:var(--accent);border:1.5px solid #cfe0ff;border-radius:999px;
         padding:6px 14px;font-size:14px;font-weight:800;cursor:pointer}
  .crumb:hover{border-color:var(--accent)}
  .dom-head{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--muted);margin:10px 0 -2px;padding-left:2px}

  /* ===== 診断（つみきタワー） ===== */

  .t.shaky{background:#fff6e3;color:#a86a00;border-color:#f4dca0}

  .weaklist{margin-top:6px}
  .wk{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--line);border-radius:12px;
      padding:14px 16px;margin-bottom:10px;background:#fff}
  .wk input{margin-top:5px;width:18px;height:18px;flex:none}
  .wk .badge{flex:none;font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;margin-top:2px}
  .badge.weak{background:#fdeaea;color:#c23b3b} .badge.shaky{background:#fff6e3;color:#a86a00}
  .wk .info{min-width:0}
  .wk .u{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
  .wk .s{display:block;font-weight:800;font-size:18px;line-height:1.4}
  .wk-all{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;margin:6px 0 4px;cursor:pointer}
  .wk-all input{width:22px;height:22px;flex:none}
  rt{font-size:.55em;font-weight:500}
  ruby{ruby-align:center}
  .furi-fab{position:fixed;right:14px;bottom:14px;z-index:50;background:#fff;color:var(--ink);
            border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;font-size:14px;

             padding:13px 16px;margin:0 auto 10px;max-width:210mm;font-weight:800;color:#234;font-size:16px;line-height:1.7}
  .ws-banner .em{color:var(--accent)}

  .qgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;

  .q{display:flex;flex-direction:column;justify-content:space-between;
     font-size:19px;padding:12px 0;border-bottom:1px dotted #d9d9d9}
  .q.choice{justify-content:flex-start}
  .qtext{display:flex;align-items:center;gap:7px;line-height:1.5}
  .q .no{color:var(--accent);font-weight:700;flex:none}
  .qtext .body{min-width:0}
  .q .body{font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:break-word}
  .write{display:inline-block;min-width:8em;border-bottom:1.5px solid #444;
         text-align:center;color:var(--ok);font-weight:700;text-indent:0}
  .write.short{min-width:3.5em;margin-left:18px}
  .ansline{padding-left:32px;text-indent:0}
  .opts{margin:10px 0 0 32px;color:#333;font-size:16px;text-indent:0}
  .opt{display:inline-block;margin-right:18px;white-space:nowrap}
  .answers{flex:none;border-top:2px dashed #cbd5e2;margin-top:12px;padding-top:8px;

  .answers .ans-label{display:inline-block;font-weight:800;color:var(--accent);margin-right:10px}
  .answers .ans{display:inline-block;margin-right:16px;white-space:nowrap}

  .sendbox{max-width:210mm;margin:12px auto 0;border:2px solid var(--accent);background:var(--accent2);border-radius:14px;padding:14px 16px}
  .sendbox .go{font-size:18px}
  .sendmsg{margin-top:8px;font-weight:800}
  .sendmsg.err{color:#c23b3b} .sendmsg.ok{color:var(--ok)}
  .conn{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;margin-bottom:8px}
  .conn.on{background:#e9f9ef;color:#0f7a37} .conn.off{background:#fff4e0;color:#b06a00}
  #capture{position:fixed;left:-10000px;top:0;width:794px}
  #capture .sheet{width:794px;max-width:none;border:none;border-radius:0;margin:0}
  @media (max-width:600px){
    .quizlayout{flex-direction:column-reverse}
    .tower-wrap{flex:none;align-self:center}
    .tower{min-height:0}
    .q-text{font-size:21px}
    .choices2{gap:10px}
    .cbtn{font-size:19px;padding:15px 10px}
    .qgrid{grid-template-columns:1fr}

  @media print{
    body{background:#fff}
    .wrap{max-width:none;padding:0;margin:0}
    #app,.noprint{display:none !important}
    #sheets{margin:0}
    .ws-banner{display:none !important}
    .sheet{border:none;border-radius:0;padding:0;width:auto;max-width:none;
           height:255mm;min-height:0;overflow:hidden;margin:0;page-break-after:always}
    .sheet:last-child{page-break-after:auto}
    .q{font-size:16px;break-inside:avoid}
    @page{size:A4 portrait;margin:14mm}
  }
</style>

<script>
/* 先生の印刷ステーションのQR（#c=...）を受け取って、このiPadに覚える（印刷ステーションと共通） */
function readTeacherLink(){
  var m = location.hash.match(/c=([A-Za-z0-9_-]+)/);
  if (!m) return false;
  try { var c = PS.decLink(m[1]); if ((c.o && c.r && c.t && c.f) || c.p) PS.lsSet("ps-kid-cfg", c); } catch(e){}
  history.replaceState(null, "", location.pathname);
  return true;
}
readTeacherLink();
// 開いているタブにリンクを貼ったとき（#c= だけ変わったとき）も読みとって、表示をなおす
window.addEventListener("hashchange", function(){ if (readTeacherLink() && typeof rerender==="function") rerender(); });
function teacherCfg(){ return PS.lsGet("ps-kid-cfg"); }
function connBadge(){ return teacherCfg() ? '<span class="conn on">📶 せんせいの いんさつステーションと つながっています（うけつけコード：'+PS.codeOf(teacherCfg())+'）</span>' : '<span class="conn off">⚠️ せんせいの QRコードを まだ よみとって いません</span>'; }
</script>
<script>
/* ==================================================================
   算数プリント自動作成（にがてはっけん）
   ・診断＝「さんすう つみきタワー」準拠（gn の q / confirm）
   ・プリント＝「算数プリントメーカー」準拠（GEN / TAXO / 描画）
   両アプリは単元キーが共通なので、診断で見つけた
   {key, skillIdx, にがて度} を GEN[key][skillIdx](level) に渡すだけで連結。
   ================================================================== */

/* ===== 算数プリントメーカー: スキル別ジェネレータ =====
   各 gen(level) は {q, a} (記述式) か {q, a, ch:[...]} (選択式) を返す。
   ch がある場合は a を必ず含む。 */

const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const coin=()=>R(0,1)===0;
const gcd=(a,b)=>b?gcd(b,a%b):a;
// 小学校の分数表記（分子を上・分母を下の横棒）
const jf=(n,d)=>`<span class="frac"><span class="fn">${n}</span><span class="fd">${d}</span></span>`;
function jfr(n,d){const g=gcd(Math.abs(n),d)||1;n/=g;d/=g;return d===1?`${n}`:jf(n,d);} // 約分
const rnd=(x,p)=>+x.toFixed(p===undefined?2:p);
const yen=n=>`${n}円`;
// 選択肢を作る（答え+distractors、重複除去、4つに調整）
function C(q,a,arr){
  a=String(a); const set=new Set([a]); const ch=[a];
  for(const d of arr){ const s=String(d); if(!set.has(s)){set.add(s);ch.push(s);} }
  return {q,a,ch};
}
// 数値の近い誤答を作る
function nd(ans,unit){
  unit=unit||""; const out=[]; const seen=new Set([ans]);
  const cand=[ans+1,ans-1,ans+2,ans-2,ans+ (Math.abs(ans)>=10?10:3), ans-(Math.abs(ans)>=10?10:3), ans*2, ans+5];
  for(const c of cand){ if(c!==ans && c>0 && !seen.has(c)){seen.add(c); out.push(`${c}${unit}`);} if(out.length>=3)break; }
  let k=3; while(out.length<3){ if(!seen.has(ans+k)){seen.add(ans+k);out.push(`${ans+k}${unit}`);} k++; }
  return out;
}

const GEN = {};

/* ========== 1年 数と計算 ========== */
GEN.kazu10=[ l=>{
  const hi=[10,10,20,20,20][l-1];
  return pick([
    ()=>{const n=R(0,hi-1); return {q:`${n} の つぎの 数は？`, a:n+1};},
    ()=>{const n=R(1,hi);   return {q:`${n} の まえの 数は？`, a:n-1};},
    ()=>{const n=R(2,Math.min(10,hi)); const a=R(1,n-1); return {q:`${n} は ${a} と いくつ？`, a:n-a};},
  ])();
}];
GEN.gousei10=[ l=>{
  const t=R(1,9);
  return coin()? {q:`${t} と いくつで 10？`, a:10-t} : {q:`10 は ${t} と いくつ？`, a:10-t};
}];
GEN.tashizan1=[ l=>{ // あわせる（くり上がりなし・和≤10）
  const a=R(1,8), b=R(1,Math.min(9-a,9)); return {q:`${a} ＋ ${b} は？`, a:a+b};
}];
GEN.hikizan1=[ l=>{ const a=R(2,10), b=R(1,a-1); return {q:`${a} − ${b} は？`, a:a-b}; }];
GEN.kuriagari1=[ l=>{ // 和 11〜18
  let a=R(2,9), b=R(2,9); while(a+b<11){a=R(2,9);b=R(2,9);} return {q:`${a} ＋ ${b} は？`, a:a+b};
}];
GEN.kurisagari1=[ l=>{ const a=R(11,18), b=R(a-9,9); return {q:`${a} − ${b} は？`, a:a-b}; }];
GEN.ookii_kazu1=[ l=>{
  const hi=[9,9,9,9,9][l-1];
  return coin()
    ? (()=>{const t=R(1,hi),b=R(0,9); return {q:`10 が ${t}こと ばらが ${b}こで いくつ？`, a:t*10+b};})()
    : (()=>{const n=R(11,99); return {q:`${n} は 10が ${Math.floor(n/10)}こと ばらが いくつ？`, a:n%10};})();
}];

/* ========== 2年 数と計算 ========== */
GEN.kurai_2=[ l=>pick([
  ()=>({q:`100 が 10こ 集まると？`, a:1000}),
  ()=>({q:`1000 は 100 が 何こ？`, a:"10こ"}),
  ()=>{const t=R(2,9); return {q:`100 が ${t}こ 集まると？`, a:t*100};},
  ()=>{const t=R(2,9); return {q:`1000 が ${t}こで いくつ？`, a:t*1000};},
])()];
GEN.tashi_hissan2=[ l=>{
  const [lo,hi]=[[10,50],[10,99],[20,99],[100,499],[100,999]][l-1];
  const a=R(lo,hi), b=R(lo,hi); return {q:`${a} ＋ ${b} は？`, a:a+b};
}];

  const dens=[[2,3,4],[2,3,4,6],[2,3,4,5,6],[3,4,5,6,8],[4,5,6,8,9,12]][l-1];

}

let _fmax=1; for(const k in FURI){ if(k.length>_fmax) _fmax=k.length; }
function _walk(s,onWord,onChar){
  s=String(s); let i=0, n=s.length;
  while(i<n){
    if(s[i]==="<"){ const j=s.indexOf(">",i); if(j>=0){ onChar(s.slice(i,j+1)); i=j+1; continue; } }
    let hit=null;
    for(let L=Math.min(_fmax,n-i); L>=1; L--){ const sub=s.substr(i,L); if(FURI[sub]!==undefined){ hit=sub; break; } }
    if(hit){
      let rd=FURI[hit];
      if(hit==="分"){ rd = /[0-9０-９]/.test(i>0?s[i-1]:"") ? "ふん" : "ぶん"; } // 5分=ふん / いくつ分=ぶん
      onWord(hit,rd); i+=hit.length;
    } else { onChar(s[i]); i++; }
  }
}
function furi(s){ let o=""; _walk(s,(w,r)=>o+=`<ruby>${w}<rt>${r}</rt></ruby>`,c=>o+=c); return o; }
function kana(s){ let o=""; _walk(s,(w,r)=>o+=r,c=>o+=c); return o; }

function candidateSkills(){
  const items=[];
  TAXO.filter(u=>u.g===S.grade && (S.domain==="all"||u.dom===S.domain) && (!S.unitKey || u.key===S.unitKey)).forEach(u=>{
    u.skills.forEach((sn,i)=>items.push({key:u.key, skillIdx:i, unit:u.unit, dom:u.dom, skill:sn}));
  });
  return items;
}

/* ================================================================
   しんだん キュー作成
   ================================================================ */
function buildQueue(){
  // 5問で判定：領域をまんべんなく 最大5スキル（少なければ ある分だけ）
  const all=candidateSkills();
  const byDom={}; DOM_ORDER.forEach(d=>byDom[d]=[]);
  all.forEach(it=>byDom[it.dom].push(it));
  Object.keys(byDom).forEach(d=>byDom[d]=shuffle(byDom[d]));
  const target=Math.min(5, all.length), out=[]; let added=true;
  while(out.length<target && added){
    added=false;
    for(const d of DOM_ORDER){ if(byDom[d].length){ out.push(byDom[d].shift()); added=true; if(out.length>=target)break; } }
  }
  return shuffle(out);
}
function startDiagnostic(){
  S.queue=buildQueue(); S.pos=0; S.phase="q"; S.results={};
  quizScreen();
}

  S.screen="result"; mountFuriToggle();

  const home2=document.getElementById("home2"); if(home2) home2.onclick=homeScreen;
  const again=document.getElementById("again"); if(again) again.onclick=startDiagnostic;
  const chal=document.getElementById("challenge");
  if(chal) chal.onclick=()=>{ // 全問できた子向け：受けた単元を ★4 で
    const tested=recs.map(r=>({...r})); makeWorksheets(tested, 4); };
  const mk=document.getElementById("makews");
  if(mk){
    app.querySelectorAll(".star.lv").forEach(s=>s.onclick=()=>{
      app.querySelectorAll(".star.lv").forEach(x=>x.classList.remove("on"));
      s.classList.add("on"); S.levelMode = s.dataset.lv==="auto"?"auto":+s.dataset.lv;
    });
    mk.onclick=()=>{ makeWorksheets(targets, null); };
  }
}

/* ================================================================
   画面4：プリント（自動生成）
   ================================================================ */
function levelFor(rec, forced){
  if(forced) return forced;
  if(S.levelMode!=="auto") return S.levelMode;
  return rec.status==="weak" ? 1 : (rec.status==="shaky" ? 2 : 3); // にがては やさしめから
}
function genProblems(key, idx, level){
  const gen=GEN[key][idx]; const qty=10; const cur=[]; const seen=new Set(); let guard=0;
  while(cur.length<qty && guard<qty*120){
    guard++; const o=gen(level);
    const k=o.q+"||"+(o.ch?o.ch.join("／"):o.a);
    if(seen.has(k)) continue; seen.add(k);
    if(o.ch) o.ch=shuffle(o.ch);
    cur.push(o);
  }
  const uniq=cur.length; let i=0;
  while(cur.length<qty && uniq>0){
    const s=cur[i%uniq];
    cur.push(s.ch?{q:s.q,a:s.a,ch:shuffle(s.ch.slice())}:{q:s.q,a:s.a}); i++;
  }
  return cur;
}
function makeWorksheets(recs, forcedLevel){
  S.sheetsData = recs.map(r=>{
    const lv=levelFor(r, forcedLevel);
    return {rec:r, level:lv, problems:genProblems(r.key, r.skillIdx, lv)};
  });
  S.showAns=false; S.sheetIdx=0;
  renderWorksheet();
  window.scrollTo(0,0);
}
function renderWorksheet(){
  app.style.display="none";
  const N=S.sheetsData.length;
  S.sheetIdx=Math.max(0,Math.min(S.sheetIdx,N-1));
  const sd=S.sheetsData[S.sheetIdx];
  const u=unitByKey(sd.rec.key), skill=u.skills[sd.rec.skillIdx];
  const tag = sd.rec.status==="weak"?"にがて":(sd.rec.status==="shaky"?"あとすこし":"ちょうせん");
  const nums="①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳".split("");
  const labels="アイウエオ".split("");
  const isLast = S.sheetIdx >= N-1;

  let html = `<div class="wsbar noprint">
      <div class="wsstep">📄 プリント <b>${S.sheetIdx+1}</b> / ${N} まいめ</div>
      <div class="ws-banner"><b>${tag}</b>だった ところの れんしゅうだよ！
        <span class="wb-u">たんげん：<span class="em">${disp(u.unit)}</span></span>
        <span class="wb-s">スキル：<span class="em">${disp(skill)}</span></span></div>
    </div>`;

  html += `<div class="sheet" data-si="${S.sheetIdx}">
      <div class="sheet-head">
        <div class="sheet-line1">${disp("算数プリント")}　${u.g}${disp("年生")}　｜　<span class="nw">むずかしさ ${"★".repeat(sd.level)}</span></div>
        <div class="sheet-unit">たんげん：${disp(u.unit)}</div>
        <div class="skillrow">
          <div class="sheet-skill">${disp(skill)}</div>
          <div class="namebox"><span class="nf"><input class="nfin nf-year" inputmode="numeric">年</span><span class="nf"><input class="nfin nf-kumi" inputmode="numeric">組</span><span class="nf"><input class="nfin nf-ban" inputmode="numeric">番</span></div>
        </div>
      </div>`;
  const hasChoice=sd.problems.some(o=>o.ch);
  html += `<div class="qgrid${hasChoice?" one":""}">`;
  sd.problems.forEach((o,i)=>{
    const no=`<span class="no">${nums[i]||(i+1)}</span>`;
    const ans="&nbsp;"; // 問題欄は常に空欄。答えは下の「こたえ」欄に
    if(o.ch){
      const opts=`<div class="opts">`+o.ch.map((c,j)=>`<span class="opt">${labels[j]}. ${disp(c)}</span>`).join("")+`</div>`;
      html+=`<div class="q choice"><div class="qtext">${no}<span class="body">${disp(o.q)}</span><span class="write short">${ans}</span></div>${opts}</div>`;
    }else{
      html+=`<div class="q"><div class="qtext">${no}<span class="body">${disp(o.q)}</span></div><div class="ansline"><span class="write">${ans}</span></div></div>`;
    }
  });
  html += `</div>`; // qグリッドを閉じる
  if(S.showAns){
    html += `<div class="answers"><span class="ans-label">こたえ</span>`+
      sd.problems.map((o,i)=>`<span class="ans"><b>${nums[i]||(i+1)}</b>${disp(o.a)}</span>`).join("")+`</div>`;
  }
  html += `</div>`; // .sheet を閉じる

  html += `<div class="sendbox noprint">
      <button class="go" id="sendBtn">📨 せんせいに おくる（${N}まい ぜんぶ）</button>
      <div style="font-size:13px;color:var(--muted);margin-top:6px">プリントの 上の 「年・組・番」を かいてから おしてね。せんせいの いんさつステーションに とどきます。</div>
      <div class="sendmsg" id="sendMsg"></div>
    </div>`;
  html += `<div class="wsbtns noprint">
      <button class="ghost big" id="printBtn">🖨 じぶんで いんさつ / PDF</button>
      <button class="ghost big" id="ansBtn">${S.showAns?"こたえを かくす":"こたえを 見る"}</button>
      <button class="ghost big" id="regenBtn">🔀 べつの もんだい</button>
      <div class="navrow">
        ${S.sheetIdx>0?'<button class="ghost" id="prevBtn">← まえの プリント</button>':''}
        ${!isLast?'<button class="go" id="nextBtn">つぎの プリント →</button>':'<span class="donemsg">これで さいご！🎉</span>'}
        <button class="ghost" id="backBtn">けっかに もどる</button>
        <button class="ghost" id="homeBtn">↩ さいしょから</button>
      </div>
    </div>`;

  sheetsEl.innerHTML=html;
  S.screen="ws"; mountFuriToggle();

  const sheet=sheetsEl.querySelector(".sheet");
  const y=sheet.querySelector(".nf-year"),k=sheet.querySelector(".nf-kumi"),b=sheet.querySelector(".nf-ban");
  y.value=S.name.year!==""?S.name.year:String(S.grade||"");
  k.value=S.name.kumi; b.value=S.name.ban;
  y.oninput=()=>S.name.year=y.value;
  k.oninput=()=>S.name.kumi=k.value;
  b.oninput=()=>S.name.ban=b.value;

  document.getElementById("printBtn").onclick=()=>window.print();
  document.getElementById("sendBtn").onclick=sendAllSheets;
  document.getElementById("ansBtn").onclick=()=>{ S.showAns=!S.showAns; renderWorksheet(); };
  document.getElementById("regenBtn").onclick=()=>{ sd.problems=genProblems(sd.rec.key, sd.rec.skillIdx, sd.level); renderWorksheet(); };
  const nx=document.getElementById("nextBtn"); if(nx) nx.onclick=()=>{ S.sheetIdx++; S.showAns=false; renderWorksheet(); window.scrollTo(0,0); };
  const pv=document.getElementById("prevBtn"); if(pv) pv.onclick=()=>{ S.sheetIdx--; S.showAns=false; renderWorksheet(); window.scrollTo(0,0); };
  document.getElementById("backBtn").onclick=()=>{ app.style.display=""; sheetsEl.innerHTML=""; resultScreen(); };
  document.getElementById("homeBtn").onclick=homeScreen;
}

/* ================================================================
   先生の印刷ステーションへ おくる
   ================================================================ */
let sending=false;
function sendMsg(t,cls){ const el=document.getElementById("sendMsg"); if(el){ el.textContent=t; el.className="sendmsg"+(cls?" "+cls:""); } }
async function sheetToJpeg(i){
  // 見えないところに A4はばで プリントを かいて、画像にする
  const keep={idx:S.sheetIdx, ans:S.showAns};
  S.sheetIdx=i; S.showAns=false; renderWorksheet();
  const sheet=sheetsEl.querySelector(".sheet").cloneNode(true);
  // 名前らんの 入力を そのまま 文字に
  sheet.querySelectorAll("input").forEach(inp=>{ const sp=document.createElement("span"); sp.className=inp.className; sp.style.display="inline-block"; sp.textContent=inp.value||"\u00a0"; inp.replaceWith(sp); });
  const cap=document.getElementById("capture"); cap.innerHTML=""; cap.appendChild(sheet);
  const canvas=await html2canvas(sheet,{scale:2,backgroundColor:"#ffffff",windowWidth:1000,logging:false});
  cap.innerHTML="";
  S.sheetIdx=keep.idx; S.showAns=keep.ans;
  const blob=await new Promise(r=>canvas.toBlob(r,"image/jpeg",0.85));
  return {bytes:await blob.arrayBuffer(), w:canvas.width, h:canvas.height};
}
async function sendAllSheets(){
  if(sending) return;
  const cfg=teacherCfg();
  if(!cfg){ sendMsg("せんせいの QRコードを よみとってから おくってね。（じぶんで いんさつ も できるよ）","err"); return; }
  const y=String(S.name.year||S.grade||"").trim(), k=String(S.name.kumi||"").trim(), b=String(S.name.ban||"").trim();
  if(!/^[0-9０-９]+$/.test(k) || !/^[0-9０-９]+$/.test(b)){ sendMsg("プリントの 上の 「組」と「番」を かいてね。","err"); return; }
  const num=v=>+String(v).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  sending=true; const btn=document.getElementById("sendBtn"); if(btn) btn.disabled=true;
  const startIdx=S.sheetIdx;
  try{
    const lib=window.PDFLib, pdf=await lib.PDFDocument.create(), A4=[595.28,841.89];
    for(let i=0;i<S.sheetsData.length;i++){
      sendMsg(`プリントを PDFに しています… ${i+1} / ${S.sheetsData.length}`);
      const j=await sheetToJpeg(i), img=await pdf.embedJpg(j.bytes);
      const sc=Math.min(A4[0]/j.w, A4[1]/j.h), page=pdf.addPage(A4);
      page.drawImage(img,{x:(A4[0]-j.w*sc)/2, y:A4[1]-j.h*sc, width:j.w*sc, height:j.h*sc});
    }
    S.sheetIdx=startIdx; renderWorksheet();
    const bytes=await pdf.save();
    const units=[...new Set(S.sheetsData.map(sd=>unitByKey(sd.rec.key).unit))].join("・");
    const meta={nen:num(y), kumi:num(k), ban:num(b), name:"算数プリント（"+units+"）", pages:S.sheetsData.length, at:new Date().toISOString()};
    sendMsg("せんせいに つないでいます…");
    await PS.sendToTeacher(cfg, meta, bytes, t=>sendMsg(t));
    sendMsg(`とどいたよ！🎉 ${S.sheetsData.length}まいの プリントが せんせいの ところで いんさつ できるよ。`,"ok");
  }catch(e){
    S.sheetIdx=startIdx; renderWorksheet();
    sendMsg("⚠️ "+(e&&e.message||"おくれませんでした")+" もういちど おしてね。","err");
  }finally{
    sending=false; const b2=document.getElementById("sendBtn"); if(b2) b2.disabled=false;
  }
}

/* start */
homeScreen();
