<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>プレゼンわざずかん</title>
<link rel="icon" href="../icon-192.png"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>:root{color-scheme:light}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
</head><body>
<style>
/* Layout: 図鑑のように「こんなとき → このワザ」のカードを並べ、開くと「ワザなし／ワザあり」のミニスライドをくらべる。提案の見本はスライドと台本を並べる */
:root{
  --paper:#F2F5FA; --card:#FFFFFF; --ink:#1D2742; --muted:#58637F; --line:#D3DAE6;
  --accent:#2C68E0; --accent-soft:#E3ECFD; --sun:#FFC83A;
  --hook:#E0532F; --hook-soft:#FDE9E2;
  --good:#17946A; --good-soft:#DDF4EA; --bad:#D9483A; --bad-soft:#FCE6E2;
  --s-bg:#FFFFFF; --s-ink:#1D2742; --s-muted:#6B7590; --s-soft:#EEF3FC; --s-soft2:#DCE3EF; --s-pinksoft:#FDEDEA;
  --s-blue:#2C68E0; --s-red:#D9483A; --s-green:#17946A; --s-yellow:#FFE27A;
  --s-paleyellow:#F1E58A; --s-pink:#EE6CB0; --s-cyan:#3EC5D4; --s-orange:#F4983C; --s-nori:#22303A; --s-rice:#FFFFFF;
  --f-display:"Dela Gothic One","Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121828; --card:#1B2337; --ink:#E8EDF7; --muted:#A2ADC6; --line:#2D3753;
  --accent:#6E9FFF; --accent-soft:#22325A; --sun:#FFD04F; --hook:#FF8A66; --hook-soft:#43231A;
  --good:#3FC690; --good-soft:#173A2E; --bad:#FF7B66; --bad-soft:#40211D; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#121828; --card:#1B2337; --ink:#E8EDF7; --muted:#A2ADC6; --line:#2D3753;
  --accent:#6E9FFF; --accent-soft:#22325A; --sun:#FFD04F; --hook:#FF8A66; --hook-soft:#43231A;
  --good:#3FC690; --good-soft:#173A2E; --bad:#FF7B66; --bad-soft:#40211D; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;font-weight:500}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.hero{display:grid;gap:10px;padding-block:12px 20px}
.hero .eyebrow{font-weight:700;color:var(--accent);letter-spacing:.08em;font-size:14px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,7vw,56px);line-height:1.15;letter-spacing:.02em}
.hero h1 .mark{background:linear-gradient(transparent 62%,var(--sun) 62%);padding:0 .08em}
.hero p{margin:0;max-width:42em;font-size:17px}
.hero p b{color:var(--hook)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 24px;border-bottom:2px solid var(--line)}
.tab{border:0;background:none;color:var(--muted);font-weight:900;font-size:16px;padding:10px 14px;border-radius:12px 12px 0 0;margin-bottom:-2px;border-bottom:4px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);background:var(--card)}

.lead{margin:0 0 18px;color:var(--muted)}
.group{margin-bottom:38px}
.ghead{display:grid;gap:4px;margin-bottom:16px}
.ghead h2{font-size:24px;font-weight:900;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ghead h2 i{font-style:normal;font-size:13px;color:var(--card);background:var(--accent);border-radius:8px;padding:2px 10px}
.group.hook .ghead h2 i{background:var(--hook)}
.ghead p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{display:grid;grid-template-rows:auto 1fr;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;color:inherit;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.group.hook .card:hover{border-color:var(--hook)}
.card .thumb{pointer-events:none}
.card .when{font-size:14px;color:var(--muted);line-height:1.6}
.card .when b{display:block;color:var(--accent);font-size:12px;letter-spacing:.06em}
.group.hook .card .when b{color:var(--hook)}
.card .name{font-weight:900;font-size:19px;line-height:1.4;display:flex;gap:8px;align-items:baseline}
.no{font-family:var(--f-display);font-weight:400;font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 10px;white-space:nowrap}
.no.h{color:var(--hook);background:var(--hook-soft)}

.back{border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;border-radius:999px;padding:6px 16px;font-size:15px}
.dhead{display:grid;gap:10px;margin:18px 0 22px}
.dhead h2{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vw,40px);line-height:1.25}
.whenbox{background:var(--accent-soft);border-radius:14px;padding:12px 16px;font-size:17px;font-weight:700;max-width:46em}
.whenbox span{display:inline-block;background:var(--accent);color:var(--card);border-radius:8px;padding:0 10px;margin-right:8px;font-size:14px}
.hookpage .whenbox{background:var(--hook-soft)} .hookpage .whenbox span{background:var(--hook)}
.compare{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);gap:10px;align-items:start}
.side{display:grid;gap:10px;min-width:0}
.tag{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:900;font-size:16px}
.tag i{font-style:normal;color:var(--card);border-radius:8px;padding:2px 12px}
.tag.bad i{background:var(--bad)} .tag.bad{color:var(--bad)}
.tag.good i{background:var(--good)} .tag.good{color:var(--good)}
.mid{align-self:center;display:grid;place-items:center;color:var(--accent);font-weight:900;font-size:13px;text-align:center;line-height:1.3}
.mid svg{width:46px;height:46px}
.btn{border:2px solid var(--accent);background:var(--card);color:var(--accent);font-weight:900;border-radius:999px;padding:6px 16px;font-size:15px}
.btn.solid{background:var(--accent);color:var(--card)}
.btn:disabled{opacity:.35;cursor:default}
.howto{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;margin-top:28px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 20px;min-width:0}
.panel h3{font-size:20px;font-weight:900;margin-bottom:10px}
.panel p{margin:0}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:st}
.steps li{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;counter-increment:st}
.steps li::before{content:counter(st);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--card);font-family:var(--f-display);font-size:16px}
.point{background:var(--sun);color:#1D2742;border-color:var(--sun)}
.point p{font-size:17px;font-weight:700}
.say{margin-top:14px;background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:16px 20px}
.say h3{font-size:18px;font-weight:900;margin-bottom:6px}
.say p{margin:0;font-size:17px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}

/* ミニスライド */
.slide{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;container-type:inline-size;background:var(--s-bg);color:var(--s-ink);border-radius:8px;box-shadow:0 0 0 2px var(--line),0 8px 20px rgba(20,30,60,.10);overflow:hidden;padding:4cqw 5cqw;display:flex;flex-direction:column;gap:2.6cqw;font-family:var(--f-body);line-height:1.5}
.s-title{font-weight:900;font-size:5.2cqw;line-height:1.25;border-bottom:.6cqw solid var(--s-blue);padding-bottom:1.2cqw}
.s-dense{font-size:2.65cqw;line-height:1.7;margin:0;font-weight:500}
.s-three{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqw}
.s-box{background:var(--s-soft);border-radius:2cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqw;text-align:center;padding:2cqw}
.s-num{display:grid;place-items:center;width:7cqw;height:7cqw;border-radius:50%;background:var(--s-blue);color:var(--s-bg);font-family:var(--f-display);font-size:3.8cqw}
.s-box b{font-size:4.2cqw;line-height:1.25}
.s-box small{font-size:2.6cqw;color:var(--s-muted)}
.s-big{flex:1;display:flex;flex-direction:column;justify-content:center;gap:3.5cqw}
.s-line{display:flex;align-items:center;gap:2.5cqw;font-size:5.4cqw;font-weight:900}
.s-chip{background:var(--s-soft);border-radius:1.6cqw;padding:.4cqw 2.4cqw}
.s-line .em{color:var(--s-red)}
.arr{width:9cqw;height:4.5cqw;flex:none}
.s-two{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}
.s-col{border-radius:2cqw;padding:2cqw 2.6cqw;border:.5cqw solid}
.s-col.g{border-color:var(--s-blue);background:var(--s-soft)} .s-col.r{border-color:var(--s-red);background:var(--s-pinksoft)}
.s-colhead{font-weight:900;font-size:3.8cqw}
.s-col.g .s-colhead{color:var(--s-blue)} .s-col.r .s-colhead{color:var(--s-red)}
.s-col ul{margin:1cqw 0 0;padding-left:4cqw;font-size:3.4cqw;font-weight:700;line-height:1.6}
.s-concl{background:var(--s-yellow);border-radius:1.6cqw;text-align:center;font-weight:900;font-size:3.6cqw;padding:1cqw}
.s-ba{flex:1;display:flex;align-items:center;justify-content:center;gap:4cqw}
.s-state{display:flex;flex-direction:column;align-items:center;gap:.6cqw}
.s-face{width:17cqw;height:17cqw}
.s-lbl{font-size:3.2cqw;font-weight:900;color:var(--s-muted)}
.s-n{font-family:var(--f-display);font-size:6.5cqw;line-height:1}
.s-n.up{color:var(--s-red)}
.s-ba .arr{width:16cqw;height:8cqw}
.s-note{position:absolute;right:5cqw;bottom:4cqw;background:var(--s-red);color:var(--s-bg);font-weight:900;font-size:3.2cqw;border-radius:999px;padding:.6cqw 2.8cqw;transform:rotate(-4deg)}
.s-table{width:100%;border-collapse:collapse;font-size:3.3cqw;font-weight:700;text-align:center;margin-top:1cqw}
.s-table th{background:var(--s-blue);color:var(--s-bg);padding:1.1cqw;font-weight:900}
.s-table td{border-bottom:.3cqw solid var(--s-soft2);padding:1.2cqw}
.s-table td:first-child{font-weight:900;background:var(--s-soft)}
.s-table.left td,.s-table.left th{text-align:left;padding-left:2cqw}
.s-table.left{font-size:3cqw}
.s-table.left td:first-child{width:34%}
.s-table.worry th:first-child{background:var(--s-red)}
.s-table.worry td:first-child{background:var(--s-pinksoft)}
.s-bars{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.4cqw}
.s-bar{display:grid;grid-template-columns:22cqw 1fr 9cqw;align-items:center;gap:1.6cqw;font-size:3cqw;font-weight:700}
.s-bar .b{height:4.2cqw;border-radius:0 1cqw 1cqw 0;background:var(--s-soft2)}
.s-bar.top .b{background:var(--s-red)} .s-bar.top{font-weight:900;color:var(--s-red)}
.s-bar span:last-child{font-variant-numeric:tabular-nums}
.s-cap{position:absolute;right:5cqw;top:13cqw;font-weight:900;font-size:3.4cqw;color:var(--s-red)}
.s-flow{flex:1;display:flex;align-items:center;justify-content:space-between;gap:.6cqw}
.s-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:.8cqw;text-align:center}
.s-step .season{font-size:2.3cqw;font-weight:900;color:var(--s-muted);min-height:3.4cqw}
.s-step .box{width:100%;background:var(--s-soft);border:.4cqw solid var(--s-blue);border-radius:1.6cqw;padding:1.6cqw .6cqw;font-size:2.9cqw;font-weight:900;line-height:1.3}
.s-step .box em{display:block;font-style:normal;font-family:var(--f-display);color:var(--s-blue);font-size:3.2cqw}
.s-flow .arr{width:4cqw;height:3cqw;margin-top:3cqw}
.s-q{font-size:4.6cqw;font-weight:900;line-height:1.35}
.s-q .q{color:var(--s-red);font-family:var(--f-display);margin-right:1cqw}
.s-opts{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;align-items:stretch}
.s-opt{border:.5cqw solid var(--s-soft2);border-radius:2cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;text-align:center;padding:1.4cqw;transition:all .3s}
.s-opt .abc{font-family:var(--f-display);font-size:5cqw;color:var(--s-blue);line-height:1}
.s-opt b{font-size:4.2cqw}
.s-opt small{font-size:2.4cqw;color:var(--s-muted)}
.revealed .s-opt.ok{border-color:var(--s-red);background:var(--s-pinksoft);transform:scale(1.04)}
.revealed .s-opt:not(.ok){opacity:.4}
.s-ans{border:0;align-self:center;background:var(--s-blue);color:var(--s-bg);font-weight:900;font-size:2.8cqw;border-radius:999px;padding:.8cqw 4cqw}
.revealed .s-ans{background:var(--s-red)}
.b9 .t{font-size:2.8cqw;color:var(--s-paleyellow);font-weight:700;border:0}
.b9 p{margin:0;font-size:2.2cqw;line-height:1.55}
.b9 .c1{color:var(--s-pink)} .b9 .c2{color:var(--s-cyan)} .b9 .c3{color:var(--s-orange)} .b9 .c4{color:var(--s-green)} .b9 .c5{color:var(--s-paleyellow)}
.g9 .s-title{font-size:6.4cqw}
.g9 .s-title b{color:var(--s-red)}
.g9 ul{margin:0;padding-left:5cqw;font-size:5cqw;font-weight:900;line-height:1.55}
.s-center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:2cqw}
.s-kicker{font-size:3.2cqw;font-weight:900;color:var(--s-muted)}
.s-huge{font-family:var(--f-display);font-size:6.6cqw;line-height:1.3}
.s-huge .red{color:var(--s-red)}
.s-src{font-size:2.2cqw;color:var(--s-muted)}
.s-reasons{display:flex;gap:2cqw;flex-wrap:wrap;justify-content:center}
.s-reasons span{background:var(--s-soft);border-radius:999px;padding:.6cqw 2.6cqw;font-size:2.9cqw;font-weight:900}
.s-onigiri{display:flex;align-items:center;gap:4cqw}
.s-onigiri svg{width:20cqw;height:18cqw}
.s-ev{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3cqw;align-items:center}
.s-stat{text-align:center;display:flex;flex-direction:column;gap:.6cqw}
.s-stat .n{font-family:var(--f-display);font-size:10cqw;line-height:1;color:var(--s-red)}
.s-stat .n small{font-size:4.4cqw;color:var(--s-ink)}
.s-stat .d{font-size:2.8cqw;font-weight:700}
.s-quote{background:var(--s-soft);border-radius:2cqw;padding:2.4cqw 3cqw;font-size:3.3cqw;font-weight:900;line-height:1.5;position:relative}
.s-quote small{display:block;font-size:2.4cqw;color:var(--s-muted);margin-top:1cqw}
.s-quote::before{content:"“";position:absolute;left:1cqw;top:-2cqw;font-size:9cqw;color:var(--s-blue);font-family:Georgia,serif;line-height:1}
.s-tag{position:absolute;left:5cqw;bottom:2.6cqw;font-size:2.2cqw;color:var(--s-muted)}
.s-action{background:var(--s-yellow);border-radius:2cqw;padding:2cqw 4cqw;font-size:5cqw;font-weight:900;line-height:1.35}
.s-thanks{font-size:2.8cqw;color:var(--s-muted);font-weight:700}
.s-cover{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2.2cqw;border-left:1.6cqw solid var(--s-red);padding-left:4cqw}
.s-cover .big{font-family:var(--f-display);font-size:7.6cqw;line-height:1.25}
.s-cover .sub{font-size:3.2cqw;font-weight:900;color:var(--s-muted)}
.s-connect{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.8cqw}
.s-crow{display:grid;grid-template-columns:22cqw 7cqw 1fr;align-items:center;gap:1.6cqw}
.s-goal{background:var(--s-blue);color:var(--s-bg);border-radius:999px;text-align:center;font-weight:900;font-size:3.6cqw;padding:.8cqw 0}
.s-crow .arr{width:7cqw;height:3.6cqw}
.s-crow .idea{background:var(--s-soft);border-radius:1.6cqw;padding:1.2cqw 2.4cqw;font-size:3.4cqw;font-weight:900}
.s-vs{flex:1;display:grid;grid-template-columns:1fr auto 1fr;gap:3cqw;align-items:center;text-align:center}
.s-vs .n{font-family:var(--f-display);font-size:9cqw;line-height:1}
.s-vs .n.red{color:var(--s-red)}
.s-vs .lab{font-size:3.4cqw;font-weight:900}
.s-vs .vs{font-family:var(--f-display);font-size:5cqw;color:var(--s-muted)}

/* 見本プレゼン */
.demo{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.demo .stage{display:grid;gap:12px;min-width:0}
.demo .ctrl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.demo .count{font-weight:900;font-variant-numeric:tabular-nums}
.demo .script{display:grid;gap:14px}
.demo .script .panel p{font-size:17px}
.role{display:inline-block;font-size:13px;font-weight:900;color:var(--card);background:var(--hook);border-radius:8px;padding:1px 10px;margin-bottom:6px}
.wazalink{border:0;background:none;padding:0;color:var(--accent);font-weight:900;font-size:16px;text-decoration:underline;text-underline-offset:3px;text-align:left}
.thumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:6px}
.thumbs button{border:0;padding:0;background:none;border-radius:8px;opacity:.55;transition:opacity .15s}
.thumbs button[aria-current="true"]{opacity:1;outline:3px solid var(--hook);outline-offset:2px}
.thumbs .slide{pointer-events:none}
.story{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;align-items:center}
.story span{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px}
.story span.on{border-color:var(--hook);color:var(--hook)}
.story em{font-style:normal;color:var(--muted)}
.memo{font-size:13px;color:var(--muted);margin-top:10px}
.scene{background:var(--hook-soft);border-radius:16px;padding:14px 18px;margin-bottom:16px;font-weight:700}
.scene b{color:var(--hook)}

/* データ */
.cols2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ways{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.way{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.way b{font-size:19px}
.way .ex{font-size:14px;color:var(--muted);line-height:1.6}
.way ul{margin:0;padding-left:1.2em;font-size:15px;line-height:1.6}
.vs2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.vcard{border-radius:16px;padding:14px 18px;border:2px solid}
.vcard.ng{border-color:var(--bad);background:var(--bad-soft)} .vcard.ok{border-color:var(--good);background:var(--good-soft)}
.vcard .lab{font-weight:900;font-size:14px}
.vcard.ng .lab{color:var(--bad)} .vcard.ok .lab{color:var(--good)}
.vcard p{margin:4px 0 0;font-size:17px;font-weight:700}
.vcard small{display:block;color:var(--muted);font-weight:700;margin-top:4px}
.maker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:start}
.form{display:grid;gap:10px}
.form label{font-weight:900;font-size:14px;color:var(--muted)}
.form input[type=text],.form input[type=number]{width:100%;font-family:inherit;font-size:16px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) 84px;gap:8px;align-items:center}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--hook)}
.hint{font-size:13px;color:var(--muted)}
.outsay{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:12px 16px;font-weight:700;margin-top:10px}

/* クイズ */
.quiz{max-width:760px}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px 22px;display:grid;gap:14px}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;font-size:14px}
.qbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qtext{font-size:19px;font-weight:900;line-height:1.6}
.qtext small{display:block;font-size:14px;color:var(--muted);font-weight:700}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:17px;font-weight:700;text-align:left}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .no{flex:none}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:12px 16px;font-weight:700}
.fb.ok{background:var(--good-soft)} .fb.ng{background:var(--bad-soft)}
.fb b{display:block;font-size:18px}
.fb.ok b{color:var(--good)} .fb.ng b{color:var(--bad)}
.qnav{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.result{text-align:center;display:grid;gap:12px;justify-items:center}
.result .score{font-family:var(--f-display);font-size:56px;line-height:1;color:var(--accent)}

/* 作り方 */
.sec{margin-bottom:34px}
.sec h2{font-size:24px;font-weight:900;margin-bottom:6px}
.sec > p{margin:0 0 14px;color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.flow .part{display:grid;gap:6px;min-width:0;align-content:start}
.flow .lab{font-weight:900;font-size:13px;text-align:center;border-radius:8px;padding:2px 4px;color:var(--card)}
.lab.a{background:var(--hook)} .lab.b{background:var(--accent)} .lab.c{background:var(--good)}
.flow .slide{padding:3cqw 5cqw;gap:2cqw;justify-content:center;align-items:center;text-align:center}
.flow .slide b{font-size:9cqw;line-height:1.25}
.flow .slide small{font-size:6.5cqw;color:var(--s-muted);font-weight:700;line-height:1.35}
.flow .sayit{font-size:13px;color:var(--muted);line-height:1.5}
.make{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;counter-reset:mk}
.make li{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;counter-increment:mk;display:grid;gap:4px;align-content:start}
.make li::before{content:"ステップ " counter(mk);font-weight:900;color:var(--accent);font-size:13px;letter-spacing:.05em}
.make b{font-size:18px}
.make span{font-size:15px;color:var(--muted);line-height:1.6}
.talk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.talk div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.talk b{display:block;font-size:18px;color:var(--hook)}
.talk span{font-size:15px;color:var(--muted);line-height:1.6}
.qa{display:grid;gap:10px}
.qa details{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 16px}
.qa summary{font-weight:900;font-size:17px;cursor:pointer}
.qa summary::marker{color:var(--hook)}
.qa p{margin:8px 0 2px;color:var(--muted)}
.cheat{width:100%;border-collapse:collapse;background:var(--card);font-size:16px}
.cheat th,.cheat td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cheat th{background:var(--accent-soft);font-weight:900}
.cheat td a{color:var(--accent);font-weight:900;text-decoration:none;white-space:nowrap}
.cheat tr.h td a{color:var(--hook)}
.tablewrap{overflow-x:auto;border:2px solid var(--line);border-radius:14px}
.checks{display:grid;gap:8px;max-width:720px}
.check{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;font-size:17px;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--good);flex:none}
.check:has(input:checked){border-color:var(--good);background:var(--good-soft)}
.done{margin-top:10px;font-weight:900;color:var(--good);font-size:18px}

@media (max-width:760px){
  .compare{grid-template-columns:minmax(0,1fr)}
  .mid svg{transform:rotate(90deg)}
  .howto,.demo,.maker{grid-template-columns:minmax(0,1fr)}
  .flow{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="wrap">

<script>
const arrow = (c='var(--s-blue)') => `<svg class="arr" viewBox="0 0 100 50" aria-hidden="true"><path d="M4 17H62V4L96 25L62 46V33H4Z" fill="${c}"/></svg>`;
const ARR = arrow();
function face(kind){
  const happy = kind === 'happy';
  const eyes = happy
    ? '<path d="M28 42Q35 34 42 42M58 42Q65 34 72 42" stroke="var(--s-ink)" stroke-width="5" fill="none" stroke-linecap="round"/>'
    : '<circle cx="35" cy="44" r="5" fill="var(--s-ink)"/><circle cx="65" cy="44" r="5" fill="var(--s-ink)"/><path d="M25 32L42 36M75 32L58 36" stroke="var(--s-ink)" stroke-width="4" stroke-linecap="round"/>';
  const mouth = happy
    ? '<path d="M30 60Q50 82 70 60Z" fill="var(--s-red)" stroke="var(--s-ink)" stroke-width="4" stroke-linejoin="round"/>'
    : '<path d="M34 72Q50 60 66 72" stroke="var(--s-ink)" stroke-width="5" fill="none" stroke-linecap="round"/>';
  return `<svg class="s-face" viewBox="0 0 100 100" role="img" aria-label="${happy?'にこにこの顔':'こまった顔'}"><circle cx="50" cy="50" r="44" fill="${happy?'var(--s-yellow)':'var(--s-soft2)'}" stroke="var(--s-ink)" stroke-width="4"/>${eyes}${mouth}</svg>`;
}
const ONIGIRI = '<svg viewBox="0 0 120 108" role="img" aria-label="おにぎり"><path d="M60 6C70 6 116 80 112 94C109 104 96 104 60 104S11 104 8 94C4 80 50 6 60 6Z" fill="var(--s-rice)" stroke="var(--s-ink)" stroke-width="4"/><rect x="38" y="66" width="44" height="38" rx="4" fill="var(--s-nori)"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dense = (title, text) => `<div class="s-title">${title}</div><p class="s-dense">${text}</p>`;
const quizSlide = (q, opts, okIdx, ans) => `<div class="s-q"><span class="q">Q.</span>${q}</div><div class="s-opts">${opts.map((o,i)=>`<div class="s-opt${i===okIdx?' ok':''}"><span class="abc">${'ABC'[i]}</span><b>${o[0]}</b><small>${o[1]}</small></div>`).join('')}</div><button class="s-ans" data-reveal="${ans}">答えを見る</button>`;
const bars = (rows, unit, tops) => { const m = Math.max(1,...rows.map(r=>r[1])); return `<div class="s-bars">${rows.map((r,i)=>`<div class="s-bar${tops.includes(i)?' top':''}"><span>${esc(r[0])}</span><div class="b" style="width:${r[1]/m*100}%"></div><span>${r[1]}${unit}</span></div>`).join('')}</div>`; };
const flowSlide = items => `<div class="s-flow">${items.map((r,i,a)=>`<div class="s-step"><div class="season">${r[0]}</div><div class="box"><em>${i+1}</em>${r[1]}</div></div>${i<a.length-1?ARR:''}`).join('')}</div>`;

/* 提案プレゼンでよく使うスライド（ワザと見本で共通） */
const SL = {
  ask:`<div class="s-center"><div class="s-kicker">校長先生へのお願い</div><div class="s-huge">雨の日の昼休みに<br><span class="red">多目的室</span>を使わせてください</div><div class="s-reasons"><span>理由1 楽しくない人が多い</span><span>理由2 ろうかが危ない</span><span>理由3 学年をこえてなかよく</span></div></div>`,
  survey:`<div class="s-title">雨の日の昼休みは楽しい？</div><div class="s-cap">38人が「楽しくない」</div>${bars([['とても楽しい',4],['楽しい',10],['あまり楽しくない',22],['楽しくない',16]],'人',[2,3])}<div class="s-tag">5年生52人へのアンケート（見本の数字です）</div>`,
  evidence:`<div class="s-title">雨の日の昼休み、こまっています</div><div class="s-ev">
    <div class="s-stat"><div class="n">38<small>人 / 52人</small></div><div class="d">「雨の日の昼休みは楽しくない」<br>と答えた5年生</div></div>
    <div class="s-quote">雨の日は、ろうかでぶつかるけがが多いですね。<small>保健の先生へのインタビュー</small></div></div>
    <div class="s-tag">5年生アンケートより（見本の数字です）</div>`,
  run:`<div class="s-title">ろうかを走っている人（10分間）</div><div class="s-vs"><div><div class="n">3人</div><div class="lab">晴れの日</div></div><div class="vs">vs</div><div><div class="n red">15人</div><div class="lab">雨の日</div></div></div><div class="s-note">5倍！</div><div class="s-tag">2階のろうかで、5年生が数えた（見本の数字です）</div>`,
  connect:`<div class="s-title">学校の目標とつながっています</div><div class="s-connect">
    <div class="s-crow"><div class="s-goal">なかよく</div>${ARR}<div class="idea">学年をこえて、いっしょに遊べる</div></div>
    <div class="s-crow"><div class="s-goal">かしこく</div>${ARR}<div class="idea">ルールを自分たちで決めて、守る</div></div>
    <div class="s-crow"><div class="s-goal">たくましく</div>${ARR}<div class="idea">ろうかを走る人がへって、安全に</div></div></div>`,
  plan:`<div class="s-title">くわしい計画</div><table class="s-table left">
    <tr><td>いつ</td><td>雨の日の昼休み（20分間）</td></tr>
    <tr><td>どこで</td><td>多目的室</td></tr>
    <tr><td>だれが</td><td>5年生の「遊び係」6人が交代で係をする</td></tr>
    <tr><td>何をする</td><td>トランプ・おりがみ・ボードゲーム</td></tr>
    <tr><td>お金・道具</td><td>学級にある道具を使う（お金はかからない）</td></tr></table>`,
  worry:`<div class="s-title">心配なことと、わたしたちの対策</div><table class="s-table left worry">
    <tr><th>心配なこと</th><th>わたしたちの対策</th></tr>
    <tr><td>けんかにならない？</td><td>ルールを作って入口にはる。係が見回る</td></tr>
    <tr><td>散らかったら？</td><td>終わる5分前に片付け。チェック表で確認</td></tr>
    <tr><td>人が多すぎたら？</td><td>1回30人まで。学年ごとに曜日を決める</td></tr></table>`,
  trial:`<div class="s-title">まずは1か月、ためさせてください</div>${flowSlide([['11月','ためしにやる'],['毎回','係が記録をつける'],['11月の終わり','アンケートをとる'],['12月','校長先生に報告']])}`,
  goal:`<div class="s-title">めざすこと</div><div class="s-ba">
    <div class="s-state">${face('sad')}<div class="s-lbl">今（雨の日）</div><div class="s-n">15人</div></div>
    ${arrow('var(--s-red)')}
    <div class="s-state">${face('happy')}<div class="s-lbl">1か月後の目標</div><div class="s-n up">5人以下</div></div></div>
    <div class="s-note">ろうかを走る人をへらす！</div>`,
  call:`<div class="s-center"><div class="s-kicker">校長先生へのお願い</div><div class="s-action">11月の1か月、ためしに<br>多目的室を使わせてください！</div><div class="s-thanks">ご検討よろしくお願いします　5年1組 遊び係</div></div>`,
};

const T = [
/* ───── 見やすくするワザ ───── */
{ id:'three', g:'see', name:'大事なことを3つにしぼる',
  when:'伝えたいことがたくさんあって、文章が長くなってしまうとき',
  before: dense('わたしたちの町のよいところ','わたしたちの町には、よいところがたくさんあります。まず、山や川などの自然がゆたかで、夏には川で魚つりをしたり、秋には紅葉を見に行ったりできます。また、おいしい食べ物もたくさんあって、とくにりんごは全国でも有名で、たくさんの人が買いに来ます。それから、町にはあいさつをしてくれるやさしい人が多いです。ほかにも、図書館が新しくなったことや、お祭りがにぎやかなことなど、いいところがいっぱいあります。'),
  after:`<div class="s-title">わたしたちの町のよいところ</div><div class="s-three">
    <div class="s-box"><span class="s-num">1</span><b>自然がゆたか</b><small>山・川・紅葉</small></div>
    <div class="s-box"><span class="s-num">2</span><b>食べ物が<br>おいしい</b><small>りんごが有名</small></div>
    <div class="s-box"><span class="s-num">3</span><b>人がやさしい</b><small>あいさつがいっぱい</small></div></div>`,
  steps:['文章を読んで、大事なことばに線を引く。','にていることを、グループにまとめる。','いちばん伝えたい3つだけをえらぶ。のこりは、話すときに言えばOK。'],
  point:'3つは、聞く人がおぼえやすい数。提案の「理由」も3つにしぼると伝わりやすいよ。' },
{ id:'keyword', g:'see', name:'長い文は、キーワードで短く',
  when:'1つの文が長くて、スライドが文字だらけになるとき',
  before: dense('朝ごはんの大切さ','朝ごはんを毎日しっかり食べると、体と頭にエネルギーが入るので、午前中の授業に集中しやすくなるといわれています。また、朝ごはんを食べると体温が上がって、元気に活動できるようになります。だから、朝ごはんはとても大切だと思います。'),
  after:`<div class="s-title">朝ごはんの大切さ</div><div class="s-big">
    <div class="s-line"><span class="s-chip">朝ごはん</span>${ARR}<span class="em">集中力アップ！</span></div>
    <div class="s-line"><span class="s-chip">朝ごはん</span>${ARR}<span class="em">体ぽかぽか・元気！</span></div></div>`,
  steps:['「何が」「どうなる」にあたる、大事なことばを見つける。','いらないことばをけずって、短くする。矢印を使うともっと短くなる。','くわしい説明は、スライドに書かずに自分の口で話す。'],
  point:'1行は15文字くらいまでが目安。スライドは「話のメモ」ではなく「看板」だと思おう。' },
{ id:'merit', g:'see', name:'メリット・デメリットでくらべる',
  when:'「いいところ」と「こまるところ」の両方を考えて、自分の意見を伝えたいとき',
  before: dense('タブレットで勉強すること','タブレットで勉強すると、わからないことをすぐに調べられるのでべんりです。でも、長く使うと目がつかれます。写真や動画が使えるのもいいところですが、ゲームなどについ使いすぎてしまうこともあります。わたしは、ルールを決めて使えばいいと思います。'),
  after:`<div class="s-title">タブレットで勉強すること</div><div class="s-two">
    <div class="s-col g"><div class="s-colhead">いいところ（メリット）</div><ul><li>すぐに調べられる</li><li>写真や動画が使える</li></ul></div>
    <div class="s-col r"><div class="s-colhead">こまるところ（デメリット）</div><ul><li>目がつかれる</li><li>つい使いすぎる</li></ul></div></div>
    <div class="s-concl">わたしの考え：ルールを決めて使おう！</div>`,
  steps:['いいところと、こまるところを、別々に書き出す。','左に「いいところ」、右に「こまるところ」をならべる。色も分けよう。','さいごに「だから、わたしは○○と考えます」と自分の意見をのせる。'],
  point:'こまるところもかくさずに見せると、「ちゃんと考えているな」と信用してもらえるよ。' },
{ id:'arrow', g:'see', name:'矢印と顔で「変化」を見せる',
  when:'「前」と「あと」でかわったことや、「今」と「めざす姿」を伝えたいとき',
  before: dense('外遊びキャンペーンの結果','わたしたち運動委員会は、休み時間に外で遊ぶ人をふやすために「外遊びキャンペーン」をしました。キャンペーンの前は、外で遊ぶ人は20人くらいで、教室でつまらなそうにしている人もいました。でも、キャンペーンのあとは35人にふえて、みんな楽しそうに遊んでいました。'),
  after:`<div class="s-title">外遊びキャンペーンの結果</div><div class="s-ba">
    <div class="s-state">${face('sad')}<div class="s-lbl">キャンペーン前</div><div class="s-n">20人</div></div>
    ${arrow('var(--s-red)')}
    <div class="s-state">${face('happy')}<div class="s-lbl">キャンペーンのあと</div><div class="s-n up">35人</div></div></div>
    <div class="s-note">15人もふえた！</div>`,
  steps:['文章の中から「前」と「あと」（または「今」と「目標」）をさがす。','左に「前」、右に「あと」を置いて、太い矢印（→）でつなぐ。','顔のイラストや数字で、どうかわるかを見せる。'],
  point:'提案では「今はこう → やってみたらこうなる」を見せると、やる意味が伝わるよ。' },
{ id:'table', g:'see', name:'表にまとめて、くらべやすく',
  when:'いくつかのものを、同じポイントでくらべたいとき',
  before: dense('3つの動物をくらべよう','ライオンは大きな動物で、肉を食べ、アフリカの草原にすんでいます。うさぎは小さな動物で、草を食べ、野原や森にすんでいます。ペンギンは中くらいの大きさの鳥で、魚を食べ、南極などの寒い海の近くにすんでいます。'),
  after:`<div class="s-title">3つの動物をくらべよう</div><table class="s-table">
    <tr><th>動物</th><th>大きさ</th><th>食べ物</th><th>すんでいる所</th></tr>
    <tr><td>ライオン</td><td>大きい</td><td>肉</td><td>草原</td></tr>

const optLabel = id => `${tagNo(byId[id])}${byId[id].name}`;
function renderQuiz(){
  const s = quizState;
  if(s.i >= Q.length){
    const msg = s.score === Q.length ? 'ぜんぶ正解！提案名人だね。' : s.score >= Q.length-2 ? 'すごい！もう少しで名人。' : 'ずかんを見直して、もう一回ちょうせんしよう。';
    view.innerHTML = `<div class="quiz"><div class="qcard result"><div>けっか</div><div class="score">${s.score} / ${Q.length}</div><div class="qtext">${msg}</div>
      <div class="qnav"><button class="btn" data-tab="zukan">ずかんを見る</button><button class="btn solid" id="retry">もう一回</button></div></div></div>`;
    document.getElementById('retry').onclick = ()=>{ quizState={i:0,score:0,answered:false}; renderQuiz(); };
    return;
  }
  const q = Q[s.i];
  view.innerHTML = `<div class="quiz"><p class="lead">提案プレゼンを作っていて、こんなときはどのワザを使う？</p><div class="qcard">
    <div class="qmeta"><span>もんだい ${s.i+1} / ${Q.length}</span><span>正解 ${s.score}</span></div>
    <div class="qbar"><i style="width:${s.i/Q.length*100}%"></i></div>
    <div class="qtext"><small>こんなとき…</small>${q.q}</div>
    <div class="opts">${q.o.map(id=>`<button class="opt" data-ans="${id}">${optLabel(id)}</button>`).join('')}</div>
    <div id="fb"></div></div></div>`;
  view.querySelectorAll('[data-ans]').forEach(b=>b.addEventListener('click',()=>{
    if(s.answered) return; s.answered = true;
    const ok = b.dataset.ans === q.a; if(ok) s.score++;
    view.querySelectorAll('[data-ans]').forEach(x=>{ x.disabled = true; if(x.dataset.ans===q.a) x.classList.add('right'); });
    if(!ok) b.classList.add('wrong');
    document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'ng'}"><b>${ok?'せいかい！':'おしい！'}</b>答えは「${byId[q.a].name}」。${q.why}</div>
      <div class="qnav" style="margin-top:12px"><button class="btn" data-go="${q.a}">このワザを見る</button><button class="btn solid" id="nextq">${s.i+1<Q.length?'次のもんだい →':'けっかを見る'}</button></div>`;
    document.getElementById('nextq').onclick = ()=>{ s.i++; s.answered=false; renderQuiz(); };
  }));
}

function setTab(tab){ document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===tab)); }
function route(){
  const h = location.hash.slice(1);
  if(byId[h]){ setTab('zukan'); renderDetail(h); }
  else if(h==='demo'){ setTab('demo'); renderDemo(); }
  else if(h==='data'){ setTab('data'); renderData(); }
  else if(h==='quiz'){ setTab('quiz'); renderQuiz(); }
  else if(h==='guide'){ setTab('guide'); renderGuide(); }
  else { setTab('zukan'); renderZukan(); }
}
function go(h){ if(location.hash.slice(1)===h){ route(); } else { location.hash = h; } window.scrollTo({top:0}); }
window.addEventListener('hashchange', ()=>{ route(); window.scrollTo({top:0}); });

document.addEventListener('click', e=>{
  const r = e.target.closest('[data-reveal]');
  if(r){ const s = r.closest('.slide'); const on = s.classList.toggle('revealed'); r.textContent = on ? r.dataset.reveal : '答えを見る'; return; }
  const dm = e.target.closest('[data-demo]'); if(dm){ demoIdx = +dm.dataset.demo; renderDemo(); return; }
  const g = e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const tb = e.target.closest('[data-tab]'); if(tb){ go(tb.dataset.tab); return; }
});
document.addEventListener('keydown', e=>{
  if(location.hash.slice(1)!=='demo' || e.target.closest('input')) return;
  if(e.key==='ArrowRight' && demoIdx<DEMO.length-1){ demoIdx++; renderDemo(); }
  if(e.key==='ArrowLeft' && demoIdx>0){ demoIdx--; renderDemo(); }
});
route();
</script>
