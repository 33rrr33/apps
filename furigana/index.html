<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ふりがなテスト</title>
<meta name="description" content="漢字の読みをこたえる・かんじをドラッグ。写真からテストを自動作成。">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c96f3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ふりがな">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../icon-192.png">
<!-- UDフォント（ユニバーサルデザイン書体・LDの子にも読みやすい） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  :root{
    --bg:#f5f2ec;--panel:#fff;--ink:#2f2a24;--sub:#7c7367;--line:#e6ded0;
    --accent:#c96f3f;--accent-soft:#fbeee4;--gray:#9a9186;--shadow:0 2px 12px rgba(90,70,40,.08);
    --ok:#2e8b57;--ok-soft:#e5f3ea;--ng:#c0392b;--ng-soft:#fbe9e7;
    --tile:#fff6ec;--tile-line:#e6c9a8;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#211d18;--panel:#2c2721;--ink:#f0e9dd;--sub:#a99f90;--line:#3d362d;
    --accent:#e0895a;--accent-soft:#3a2f26;--gray:#7d7568;--shadow:0 2px 14px rgba(0,0,0,.35);
    --ok:#5fce8f;--ok-soft:#243a2d;--ng:#f0857a;--ng-soft:#3a2723;
    --tile:#3a3128;--tile-line:#5c4c39;
  }}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{overscroll-behavior-y:none}
  body{margin:0;padding:0 14px calc(120px + env(safe-area-inset-bottom));
    padding-top:env(safe-area-inset-top);
    font-family:"UD デジタル教科書体 NP-R","UDデジタル教科書体 NP-R","UD Digi Kyokasho NP-R","UD Digi Kyokasho N-R","BIZ UDPGothic","BIZ UDPゴシック","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP","Noto Sans CJK JP",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%;}
  header{max-width:680px;margin:0 auto;padding:22px 4px 4px;text-align:center}
  h1{font-size:1.45rem;margin:0 0 2px}
  .lead{color:var(--sub);margin:0;font-size:.82rem}
  main{max-width:none;margin:0}
  .bar,.modes,.score{max-width:640px;margin-left:auto;margin-right:auto}

  /* ---- toolbar ---- */
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px auto 6px}
  .bar .grow{flex:1 1 140px;min-width:120px}
  select,.btn{font-family:inherit;font-size:.9rem;border-radius:14px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);padding:11px 13px;box-shadow:var(--shadow);cursor:pointer}
  select{width:100%;font-weight:700}
  .btn{font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:transform .1s}
  .btn:active{transform:scale(.96)}
  .btn.icon{padding:11px 12px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{background:transparent;box-shadow:none}

  /* ---- mode tabs ---- */
  .modes{display:flex;gap:6px;background:var(--accent-soft);padding:5px;border-radius:16px;margin:8px 0 16px}
  .modes button{flex:1;border:none;background:transparent;color:var(--sub);font-family:inherit;
    font-weight:700;font-size:.92rem;padding:11px 6px;border-radius:12px;cursor:pointer;transition:.12s}
  .modes button.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}

  /* ---- score banner ---- */
  .score{display:none;align-items:center;justify-content:space-between;gap:10px;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:12px 16px;box-shadow:var(--shadow);margin:0 0 14px}
  .score.show{display:flex}
  .score .pt{font-size:1.7rem;font-weight:800;color:var(--accent)}
  .score .pt small{font-size:.9rem;color:var(--sub);font-weight:700}
  .score .msg{font-size:.9rem;color:var(--sub)}

  /* ===== 縦書きワークシート（iPad向け・①→⑩を右から左へ） ===== */
  #stage.sheetv{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0}
  .vrow{display:flex;flex-direction:row;align-items:flex-start;gap:10px;
    width:max-content;margin-inline:auto;padding:12px 14px 50px}
  .vcol{position:relative;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:12px;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:11px 7px;box-shadow:var(--shadow)}
  .vno{display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex:0 0 auto;
    background:var(--accent-soft);color:var(--accent);border-radius:50%;font-weight:800;font-size:1.05rem}
  .vsent{position:relative;writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;white-space:nowrap;
    font-size:1.5rem;line-height:1.8;letter-spacing:.01em;flex:0 0 auto;text-align:start}
  .vsent1{padding-right:1.75em} /* モード1のみ：読み欄のレーンを右に確保 */
  .vsent .target{color:var(--accent);font-weight:800;background:var(--accent-soft);border-radius:6px;padding:1px 2px}

  /* mode1: 読みを漢字の右どなり（ふりがなの位置）に、かなタイルをドラッグして置く。
     右側に専用レーン(padding-right)を確保し、そこへ絶対配置。漢字と重ならない */
  .tgtwrap{position:relative;display:inline-block;vertical-align:top}
  .ryslots{position:absolute;top:0;left:100%;margin-left:4px;
    writing-mode:horizontal-tb;display:flex;flex-direction:column;gap:3px;align-items:center}
  .slot.ry{width:1.45em;height:1.45em;line-height:1.4em;font-size:1.05rem;border-radius:7px;margin:0}
  .item.correct{background:var(--ok-soft);border-color:var(--ok)}
  .item.wrong{background:var(--ng-soft);border-color:var(--ng)}
  .item.correct .slot.ry{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
  .item.wrong .slot.ry{border-color:var(--ng);background:var(--ng-soft);color:var(--ng)}
  /* こたえ表示は列の下に絶対配置。列の幅に影響させない(=右がはみ出さない) */
  .verdict{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;
    writing-mode:horizontal-tb;white-space:nowrap;font-weight:800;font-size:.9rem;display:none;text-align:center}
  .verdict.show{display:block}
  .verdict.c{color:var(--ok)} .verdict.w{color:var(--ng)}
  .verdict .mark{font-size:1.2rem;margin-right:2px}

  /* mode2: ますとルビ（縦書きではルビは右側に自動配置） */
  ruby.grp{ruby-position:over;-webkit-ruby-position:before}
  ruby.grp>rt{font-size:1.05rem;color:var(--accent);font-weight:800;letter-spacing:.04em;padding-left:5px}
  .slot{display:inline-block;overflow:hidden;width:1.85em;height:1.85em;line-height:1.8em;text-align:center;
    border:2px dashed var(--tile-line);border-radius:10px;background:var(--bg);
    font-size:1.95rem;font-weight:700;color:var(--ink);margin:3px 0}
  .slot.filled{border-style:solid;background:var(--tile);border-color:var(--accent)}
  .slot.selhi{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
  .okuri{font-size:1.95rem;font-weight:700}
  .grp.g-correct .slot{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
  .grp.g-wrong .slot{border-color:var(--ng);background:var(--ng-soft);color:var(--ng)}
  .fix{writing-mode:horizontal-tb;font-size:.82rem;color:var(--ng);font-weight:800;text-align:center}

  /* bottom dock (tiles + action button) */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--panel);border-top:1px solid var(--line);
    box-shadow:0 -3px 16px rgba(90,70,40,.12);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .tray{display:none;margin-bottom:8px}
  .tray.show{display:block}
  .tray .cap{font-size:.72rem;color:var(--sub);font-weight:700;margin:0 2px 6px}
  .tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-height:32vh;overflow:auto}
  .tile{width:2.5em;height:2.5em;font-size:1.9rem;font-weight:800;
    display:flex;align-items:center;justify-content:center;
    background:var(--tile);border:2px solid var(--tile-line);border-radius:14px;color:var(--ink);
    cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .08s}
  .tile:active{transform:scale(.92)}
  .tile.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
  .tile.used{opacity:0;pointer-events:none;width:0;height:0;margin:-4px;border:0}
  .drag-ghost{position:fixed;z-index:100;pointer-events:none;
    background:var(--tile);border:2px solid var(--accent);border-radius:14px;
    width:2.5em;height:2.5em;font-size:2rem;font-weight:800;
    display:flex;align-items:center;justify-content:center;color:var(--ink);
    box-shadow:0 6px 18px rgba(0,0,0,.25);transform:translate(-50%,-50%) scale(1.1)}

  /* ---- action buttons (inside dock) ---- */
  .actions{max-width:680px;margin:0 auto;display:flex;gap:10px}
  .actions .btn{flex:1;justify-content:center;padding:15px;font-size:1.05rem}

  /* ---- modal ---- */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(30,22,12,.5);
    display:none;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}
  .modal.show{display:flex}
  .sheet{background:var(--panel);border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.3);
    width:100%;max-width:560px;padding:20px;margin:auto 0}
  .sheet h2{margin:0 0 4px;font-size:1.15rem}
  .sheet p.note{margin:0 0 14px;color:var(--sub);font-size:.82rem;line-height:1.7}
  .sheet label.fl{display:block;font-size:.8rem;font-weight:700;color:var(--sub);margin:12px 0 5px}
  .sheet input.tx,.sheet textarea.tx{width:100%;font-family:inherit;font-size:1rem;padding:11px 12px;
    border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
  .sheet input.tx:focus,.sheet textarea.tx:focus{outline:none;border-color:var(--accent)}
  .edrow{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;
    margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .edrow .n{padding-top:22px;font-weight:800;color:var(--accent);text-align:center;font-size:1.05rem}
  .edrow .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .edrow label{display:flex;flex-direction:column;gap:4px;font-size:.72rem;font-weight:800;color:var(--sub)}
  .edrow label.main{color:var(--accent)}
  .edrow input{font-size:1.05rem;padding:11px 12px;border-radius:12px;border:2px solid var(--line);
    background:var(--bg);color:var(--ink);font-family:inherit;width:100%}
  .edrow label.main input{border-color:var(--accent);background:var(--accent-soft)}
  .edrow input:focus{outline:none;border-color:var(--accent);background:var(--panel)}
  .edrow input::placeholder{color:var(--gray);font-weight:400}
  .sheet .row2{display:flex;gap:10px;margin-top:18px}
  .sheet .row2 .btn{flex:1;justify-content:center;padding:13px}
  .status{font-size:.85rem;font-weight:700;margin:10px 0 0;min-height:1.2em}
  .status.err{color:var(--ng)} .status.ok{color:var(--ok)} .status.busy{color:var(--accent)}
  .prov{display:flex;gap:8px;margin-bottom:4px}
  .prov label{flex:1;border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;
    font-size:.85rem;font-weight:700;cursor:pointer;background:var(--bg)}
  .prov input{display:none}
  .prov input:checked + span{color:var(--accent)}
  .prov label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
  a.link{color:var(--accent);font-weight:700}
  .hidden{display:none!important}
  footer{max-width:680px;margin:26px auto 0;text-align:center;color:var(--sub);font-size:.74rem}
  footer a{color:var(--accent);font-weight:700;text-decoration:none}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--accent);border-right-color:transparent;
    border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>📖 ふりがなテスト</h1>
  <p class="lead">漢字の読みをこたえる・かんじをドラッグ</p>
</header>

<main>
  <div class="bar">
    <div class="grow"><select id="testSel" aria-label="テストをえらぶ"></select></div>
    <button class="btn" id="btnPhoto" title="写真からテストを作る">🖼 写真</button>
    <button class="btn icon" id="btnEdit" title="このテストを編集">✏️</button>
    <button class="btn icon" id="btnNew" title="新しく作る">＋</button>
    <button class="btn icon ghost" id="btnSet" title="設定">⚙︎</button>
  </div>

  <div class="modes">
    <button id="tab1" class="on" data-mode="1">🔤 ふりがなをドラッグ</button>
    <button id="tab2" data-mode="2">🀄 かんじをドラッグ</button>
  </div>

  <div class="score" id="score">
    <div class="pt" id="scorePt">0<small>/100</small></div>
    <div class="msg" id="scoreMsg"></div>
  </div>

  <div id="stage"></div>
</main>

<!-- bottom dock: tile tray (mode2) + action buttons -->
<div class="dock" id="dock">
  <div class="tray" id="tray">
    <p class="cap" id="trayCap">↓ かんじを ドラッグ（またはタップ）して あてはめよう</p>
    <div class="tiles" id="tiles"></div>
  </div>
  <div class="actions" id="actions">
    <button class="btn primary" id="btnMark">◯つけする</button>
    <button class="btn ghost hidden" id="btnRetry">もう一度</button>
  </div>
</div>

<!-- settings modal -->
<div class="modal" id="mSet">
  <div class="sheet">
    <h2>⚙︎ 設定（AIで写真からテストを作る）</h2>
    <p class="note">テストの写真から自動でテストを作るには、AIのAPIキーが必要です。キーはこの端末の中だけに保存され、送信は各AIサービスへの解析リクエストのみです。</p>
    <label class="fl">つかうAI</label>
    <div class="prov" id="provPick">
      <label><input type="radio" name="prov" value="gemini"><span>Google&nbsp;Gemini<br><small>無料枠あり・おすすめ</small></span></label>
      <label><input type="radio" name="prov" value="claude"><span>Anthropic&nbsp;Claude<br><small>Claudeのキー</small></span></label>
    </div>
    <label class="fl">APIキー</label>
    <input class="tx" id="apiKey" type="password" placeholder="AIza... / sk-ant-..." autocomplete="off">
    <label class="fl">モデル名（ふつうはそのままでOK）</label>
    <input class="tx" id="apiModel" type="text" placeholder="gemini-3.6-flash">
    <p class="note" id="keyHelp" style="margin-top:10px"></p>
    <div class="row2">
      <button class="btn ghost" id="setCancel">とじる</button>
      <button class="btn primary" id="setSave">ほぞん</button>
    </div>
    <p class="status" id="setStatus"></p>
    <hr style="border:none;border-top:1px solid var(--line);margin:16px 0">
    <div class="row2" style="margin-top:0">
      <button class="btn ghost" id="btnExport">📤 バックアップ書き出し</button>
      <button class="btn ghost" id="btnImport">📥 読み込み</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" class="hidden">
  </div>
</div>

<!-- editor modal -->
<div class="modal" id="mEdit">
  <div class="sheet">
    <h2 id="edTitle">✏️ テストを作る／なおす</h2>
    <p class="note">①〜⑩の文章はそのまま。「漢字」＝ますに入る漢字（送りがなも）、「よみ」＝その読み（ひらがな）を入れてください。前後の文はあれば入れます。</p>
    <label class="fl">テストの名前</label>
    <input class="tx" id="edName" type="text" placeholder="例）カンジー博士の暗号解読③">
    <div id="edRows" style="margin-top:14px"></div>
    <div class="row2">
      <button class="btn ghost" id="edCancel">キャンセル</button>
      <button class="btn primary" id="edSave">ほぞんする</button>
    </div>
    <div class="row2" style="margin-top:8px">
      <button class="btn ghost" id="edDelete" style="color:var(--ng)">🗑 このテストを削除</button>
    </div>
    <p class="status" id="edStatus"></p>
  </div>
</div>

<input type="file" id="photoFile" accept="image/*" capture="environment" class="hidden">

<footer>
  ホーム画面に追加できます（共有 → 「ホーム画面に追加」）<br>
  <a href="../">← 先生のアプリ一覧へ</a>
</footer>

<script>
"use strict";
(function(){
  var NUM = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩"];

  /* ============ 収録テスト（写真から作成・光村5年 下）============ */
  var SAMPLES = [
    { id:"s4", title:"和語・漢語・外来語（p146〜148）", sample:true, items:[

  /* ============ storage ============ */
  var LS_TESTS = "furigana_tests_v1";
  var LS_PROV  = "furigana_provider_v1";
  var LS_KEY   = "furigana_apikey_v1";
  var LS_MODEL = "furigana_model_v1";
  var LS_LAST  = "furigana_last_v1";
  function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function loadUserTests(){ try{ return JSON.parse(localStorage.getItem(LS_TESTS)||"[]"); }catch(e){ return []; } }
  function saveUserTests(a){ try{ localStorage.setItem(LS_TESTS, JSON.stringify(a)); }catch(e){} }

  function allTests(){ return SAMPLES.concat(loadUserTests()); }
  function findTest(id){ var a=allTests(); for(var i=0;i<a.length;i++){ if(a[i].id===id) return a[i]; } return a[0]; }

  /* ============ state ============ */
  var state = { mode:1, testId:null, graded:false, place:{} , sel:null };

  /* ============ helpers ============ */
  function isKanji(ch){ return /[一-龯々〇㐀-䶿]/.test(ch); }
  function kanjiChars(s){ var out=[]; for(var i=0;i<s.length;i++){ if(isKanji(s[i])) out.push(s[i]); } return out; }
  function normYomi(s){
    s = (s||"").replace(/\s/g,"").trim();
    // katakana -> hiragana
    s = s.replace(/[ァ-ヶ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0x60); });
    return s;
  }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  /* ============ elements ============ */
  var $=function(id){ return document.getElementById(id); };
  var stage=$("stage"), testSel=$("testSel"), tray=$("tray"), tiles=$("tiles"), dock=$("dock"), trayCap=$("trayCap");
  function adjustPad(){ document.body.style.paddingBottom = (dock.offsetHeight + 16) + "px"; }
  window.addEventListener("resize", adjustPad);
  window.addEventListener("orientationchange", function(){ setTimeout(adjustPad,300); });
  var score=$("score"), scorePt=$("scorePt"), scoreMsg=$("scoreMsg");
  var btnMark=$("btnMark"), btnRetry=$("btnRetry");

  /* ============ test selector ============ */
  function fillSelector(){
    var a=allTests(), h="";
    var us=loadUserTests();
    h+='<optgroup label="収録テスト">';
    for(var i=0;i<SAMPLES.length;i++){ h+='<option value="'+SAMPLES[i].id+'">'+esc(SAMPLES[i].title)+'</option>'; }
    h+='</optgroup>';
    if(us.length){ h+='<optgroup label="じぶんで作ったテスト">';
      for(var j=0;j<us.length;j++){ h+='<option value="'+us[j].id+'">'+esc(us[j].title)+'</option>'; }
      h+='</optgroup>';
    }
    testSel.innerHTML=h;
    testSel.value=state.testId;
  }

  /* ============ render ============ */
  function render(){
    state.graded=false; state.place={}; state.sel=null;
    score.classList.remove("show");
    btnRetry.classList.add("hidden");
    btnMark.classList.remove("hidden");

  function buildTiles(pool){
    pool=shuffle(pool);
    var th="";
    for(var p=0;p<pool.length;p++){ th+='<span class="tile" data-id="tile'+p+'">'+esc(pool[p])+'</span>'; }
    tiles.innerHTML=th;
    tray.classList.add("show");
    bindTiles();
  }

  // モード1: 漢字を見て、右どなりのマスに「ふりがな(かな)」をドラッグして当てはめる
  function renderMode1(){
    var t=findTest(state.testId), h="";
    for(var i=t.items.length-1;i>=0;i--){ // ⑩→① の順にDOM生成し、視覚的に①が右端(右→左)になる
      var it=t.items[i];
      h+='<div class="item vcol" data-i="'+i+'">';
      h+= '<span class="vno">'+NUM[i]+'</span>';
      h+= '<div class="vsent vsent1">'+esc(it.before)+
          '<span class="tgtwrap"><span class="target">'+esc(it.answer)+'</span>'+
          '<span class="ryslots">';
      var y=it.yomi.split("");
      for(var s=0;s<y.length;s++){ h+='<span class="slot ry" data-i="'+i+'" data-s="'+s+'"></span>'; }
      h+= '</span></span>'+esc(it.after)+'</div>';
      h+= '<div class="verdict" data-i="'+i+'"></div>';
      h+='</div>';
    }
    stage.className="sheetv"; stage.innerHTML='<div class="vrow">'+h+'</div>';
    var pool=[];
    for(var k=0;k<t.items.length;k++){ pool=pool.concat(t.items[k].yomi.split("")); }
    trayCap.textContent="↓ ふりがな（ひらがな）を ドラッグ（またはタップ）して あてはめよう";
    buildTiles(pool);
    bindSlots();
  }

  function renderMode2(){
    var t=findTest(state.testId), h="";
    // build slots (縦書き。ルビ<rt>は縦書きで自動的に右側へ)。⑩→①順で生成し①を右端に
    for(var i=t.items.length-1;i>=0;i--){
      var it=t.items[i];
      h+='<div class="item vcol" data-i="'+i+'">';
      h+= '<span class="vno">'+NUM[i]+'</span>';
      h+= '<div class="vsent">'+esc(it.before);
      h+= '<ruby class="grp" data-i="'+i+'"><span class="row">';
      var chars=it.answer.split(""), slotIdx=0;
      for(var c=0;c<chars.length;c++){
        if(isKanji(chars[c])){
          h+='<span class="slot" data-i="'+i+'" data-s="'+slotIdx+'"></span>';
          slotIdx++;
        } else {
          h+='<span class="okuri">'+esc(chars[c])+'</span>';
        }
      }
      h+= '</span><rt>'+esc(it.yomi)+'</rt></ruby>';
      h+= esc(it.after)+'</div>';
      h+= '<div class="verdict" data-i="'+i+'"></div>';
      h+='</div>';
    }
    stage.className="sheetv"; stage.innerHTML='<div class="vrow">'+h+'</div>';
    // tiles = all kanji chars shuffled
    var pool=[];
    for(var k=0;k<t.items.length;k++){ pool=pool.concat(kanjiChars(t.items[k].answer)); }
    trayCap.textContent="↓ かんじを ドラッグ（またはタップ）して あてはめよう";
    buildTiles(pool);
    bindSlots();
  }

  /* ============ mode2 interaction (tap + pointer drag) ============ */
  function bindSlots(){
    var ss=stage.querySelectorAll(".slot");
    for(var i=0;i<ss.length;i++){ ss[i].addEventListener("click", onSlotClick); }
  }
  function bindTiles(){
    var ts=tiles.querySelectorAll(".tile");
    for(var i=0;i<ts.length;i++){ ts[i].addEventListener("pointerdown", onTilePointerDown); }
  }
  function clearSel(){
    if(state.sel){ var el=tiles.querySelector('[data-id="'+state.sel+'"]'); if(el) el.classList.remove("sel"); }
    state.sel=null;
    var hs=stage.querySelectorAll(".slot.selhi"); for(var i=0;i<hs.length;i++) hs[i].classList.remove("selhi");
  }
  function selectTile(id){
    clearSel(); state.sel=id;
    var el=tiles.querySelector('[data-id="'+id+'"]'); if(el) el.classList.add("sel");
  }
  function tileChar(id){ var el=tiles.querySelector('[data-id="'+id+'"]'); return el?el.textContent:""; }

  function placeTile(slot, tileId){
    if(state.graded) return;
    var key=slot.getAttribute("data-i")+"-"+slot.getAttribute("data-s");
    // if slot already has a tile, free it
    if(state.place[key]){ freeTile(state.place[key]); }
    // if this tile was elsewhere, remove from there
    for(var k in state.place){ if(state.place[k]===tileId){ delete state.place[k]; clearSlotDom(k); } }
    state.place[key]=tileId;
    slot.textContent=tileChar(tileId);
    slot.classList.add("filled");
    var tEl=tiles.querySelector('[data-id="'+tileId+'"]'); if(tEl) tEl.classList.add("used");
    clearSel();
  }
  function clearSlotDom(key){
    var s=stage.querySelector('.slot[data-i="'+key.split("-")[0]+'"][data-s="'+key.split("-")[1]+'"]');
    if(s){ s.textContent=""; s.classList.remove("filled"); }
  }
  function freeTile(tileId){
    var tEl=tiles.querySelector('[data-id="'+tileId+'"]'); if(tEl) tEl.classList.remove("used");
  }
  function emptySlot(slot){
    if(state.graded) return;
    var key=slot.getAttribute("data-i")+"-"+slot.getAttribute("data-s");
    if(state.place[key]){ freeTile(state.place[key]); delete state.place[key]; }
    slot.textContent=""; slot.classList.remove("filled");
  }

  function onSlotClick(e){
    if(state.graded) return;
    var slot=e.currentTarget;
    var key=slot.getAttribute("data-i")+"-"+slot.getAttribute("data-s");
    if(state.sel){ placeTile(slot, state.sel); return; }
    // no tile selected: tapping a filled slot returns its tile
    if(state.place[key]){ emptySlot(slot); }
  }

  // pointer drag (works on touch + mouse). If barely moved -> treat as tap-select.
  var drag=null;
  function onTilePointerDown(e){
    if(state.graded) return;
    var tileEl=e.currentTarget;
    if(tileEl.classList.contains("used")) return;
    var id=tileEl.getAttribute("data-id");
    drag={ id:id, el:tileEl, startX:e.clientX, startY:e.clientY, moved:false, ghost:null };
    tileEl.setPointerCapture && tileEl.setPointerCapture(e.pointerId);
    document.addEventListener("pointermove", onPointerMove);
    document.addEventListener("pointerup", onPointerUp);
    e.preventDefault();
  }
  function onPointerMove(e){
    if(!drag) return;
    var dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
    if(!drag.moved && (Math.abs(dx)>6 || Math.abs(dy)>6)){
      drag.moved=true;
      var g=document.createElement("div"); g.className="drag-ghost"; g.textContent=drag.el.textContent;
      document.body.appendChild(g); drag.ghost=g;
      drag.el.style.visibility="hidden";
    }
    if(drag.moved && drag.ghost){
      drag.ghost.style.left=e.clientX+"px"; drag.ghost.style.top=e.clientY+"px";
      // highlight slot under pointer
      var el=document.elementFromPoint(e.clientX,e.clientY);
      var slot=el&&el.closest?el.closest(".slot"):null;
      var prev=stage.querySelector(".slot.selhi"); if(prev&&prev!==slot) prev.classList.remove("selhi");
      if(slot) slot.classList.add("selhi");
    }
  }
  function onPointerUp(e){
    document.removeEventListener("pointermove", onPointerMove);
    document.removeEventListener("pointerup", onPointerUp);
    if(!drag) return;
    var d=drag; drag=null;
    if(d.ghost){ d.ghost.parentNode&&d.ghost.parentNode.removeChild(d.ghost); }
    if(d.el) d.el.style.visibility="";
    var hs=stage.querySelectorAll(".slot.selhi"); for(var i=0;i<hs.length;i++) hs[i].classList.remove("selhi");
    if(!d.moved){
      // treat as tap: toggle select
      if(state.sel===d.id) clearSel(); else selectTile(d.id);
      return;
    }
    var el=document.elementFromPoint(e.clientX,e.clientY);
    var slot=el&&el.closest?el.closest(".slot"):null;
    if(slot){ placeTile(slot, d.id); }
  }

  /* ============ grading ============ */
  function gradeMode1(){
    var t=findTest(state.testId), correct=0;
    for(var i=0;i<t.items.length;i++){
      var y=t.items[i].yomi, placed="";
      for(var s=0;s<y.length;s++){ var key=i+"-"+s; placed += state.place[key]?tileChar(state.place[key]):""; }
      var ok = placed.length===y.length && normYomi(placed)===normYomi(y);
      var card=stage.querySelector('.item[data-i="'+i+'"]');
      card.classList.remove("correct","wrong"); card.classList.add(ok?"correct":"wrong");
      var vd=stage.querySelector('.verdict[data-i="'+i+'"]');
      vd.classList.add("show"); vd.classList.remove("c","w"); vd.classList.add(ok?"c":"w");
      vd.innerHTML = ok ? '<span class="mark">◯</span>' : '<span class="mark">✕</span>'+esc(y);
      if(ok) correct++;
    }
    finishGrade(correct, t.items.length);
  }
  function gradeMode2(){
    var t=findTest(state.testId), correct=0;
    for(var i=0;i<t.items.length;i++){
      var ks=kanjiChars(t.items[i].answer);
      var grp=stage.querySelector('.grp[data-i="'+i+'"]');
      var ok=true, placedStr="";
      for(var s=0;s<ks.length;s++){
        var key=i+"-"+s;
        var ch = state.place[key] ? tileChar(state.place[key]) : "";
        placedStr+=ch||"　";
        if(ch!==ks[s]) ok=false;
      }
      grp.classList.remove("g-correct","g-wrong");
      grp.classList.add(ok?"g-correct":"g-wrong");
      var card=stage.querySelector('.item[data-i="'+i+'"]');
      card.classList.remove("correct","wrong"); card.classList.add(ok?"correct":"wrong");
      // こたえは列の下（横書きの小さな見出し）に表示。縦書きの中に入れると列が広がるため
      var vd=stage.querySelector('.verdict[data-i="'+i+'"]');
      vd.classList.add("show"); vd.classList.remove("c","w"); vd.classList.add(ok?"c":"w");
      vd.innerHTML = ok ? '<span class="mark">◯</span>' : '<span class="mark">✕</span>'+esc(t.items[i].answer);
      if(ok) correct++;
    }
    finishGrade(correct, t.items.length);
  }
  function finishGrade(correct,total){
    state.graded=true;
    var pt=Math.round(correct/total*100);
    scorePt.innerHTML=pt+'<small>点</small>';
    var m = pt===100 ? "全問せいかい！すごい！🌟" : correct>=Math.ceil(total*0.7) ? "よくできました！💮" : "もう一度ちょうせんしよう💪";
    scoreMsg.textContent = correct+" / "+total+" もん　"+m;
    score.classList.add("show");
    btnMark.classList.add("hidden");
    btnRetry.classList.remove("hidden");
    clearSel();
    adjustPad();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  /* ============ editor modal ============ */

  /* ============ AI: photo -> test ============ */
  var AI_PROMPT =
    "あなたは日本の小学校の漢字プリントを読み取るアシスタントです。"+
    "画像は『漢字を書きましょう』形式のテストで、四角い解答らんは空白、"+
    "その横に小さなひらがなの読みがな（ヒント）と前後の文が書かれています。"+
    "ヒントの読みと前後の文脈から、各問（①〜⑩）でますに入る漢字（送りがなも含む）を推測してください。"+
    "波線（〜）が付いた読みは送りがなも書くことを意味します。"+
    "文章は絶対に変えないでください。出力は次のJSONのみ（説明文なし）："+
    '{"title":"テスト名","items":[{"before":"ますの前の文","answer":"ますに入る漢字（送りがな込み）","yomi":"その読み（ひらがな全部）","after":"ますの後の文"}]}。'+
    "itemsは必ず10個。beforeやafterが無い場合は空文字\"\"。titleは単元名やページが分かれば入れる。";

  function fileToBase64(file){
    return new Promise(function(res,rej){
      var r=new FileReader();
      r.onload=function(){ var s=r.result; res(s.substring(s.indexOf(",")+1)); };
      r.onerror=rej; r.readAsDataURL(file);
    });
  }
  // 写真は大きすぎると通信が失敗するので、送信前に縮小・圧縮する
  function loadImage(file){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file);
      var img=new Image();
      img.onload=function(){ URL.revokeObjectURL(url); res(img); };
      img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error("画像を読み込めませんでした")); };
      img.src=url;
    });
  }
  function shrinkImage(file, maxDim, quality){
    return loadImage(file).then(function(img){
      var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      if(!w||!h) throw new Error("画像サイズを取得できませんでした");
      var scale=Math.min(1, maxDim/Math.max(w,h));
      var cw=Math.max(1,Math.round(w*scale)), ch=Math.max(1,Math.round(h*scale));
      var cv=document.createElement("canvas"); cv.width=cw; cv.height=ch;
      var ctx=cv.getContext("2d");
      ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,cw,ch);
      ctx.drawImage(img,0,0,cw,ch);
      var durl=cv.toDataURL("image/jpeg", quality);
      return { data:durl.substring(durl.indexOf(",")+1), mime:"image/jpeg" };
    });
  }
  // 縮小できない形式(HEIC等)は元ファイルをそのまま送る
  function prepImage(file){
    return shrinkImage(file, 1600, 0.85).catch(function(){
      return fileToBase64(file).then(function(b64){ return { data:b64, mime:(file.type||"image/jpeg") }; });
    });
  }
  function aiStatus(msg,cls){ var s=$("setStatus"); s.className="status "+(cls||""); s.innerHTML=msg; }

  $("btnPhoto").addEventListener("click", function(){
    var key=lsGet(LS_KEY,"");
    if(!key){ openSet(); aiStatus("先にAPIキーを保存してください。","err"); return; }
    $("photoFile").click();
  });
  $("photoFile").addEventListener("change", function(e){
    var f=e.target.files[0]; e.target.value="";
    if(f) analyzePhoto(f);
  });

  function analyzePhoto(file){
    var prov=lsGet(LS_PROV,"gemini"), key=lsGet(LS_KEY,""), model=lsGet(LS_MODEL,"");
    mSet.classList.add("show");
    var t0=Date.now();
    var timer=setInterval(function(){
      var s=Math.round((Date.now()-t0)/1000);
      aiStatus('<span class="spin"></span>写真を読み取っています…（'+s+'秒）<br>10〜40秒ほどかかります。',"busy");
    },1000);
    function stop(){ clearInterval(timer); }
    aiStatus('<span class="spin"></span>写真を読み取っています…（0秒）',"busy");
    prepImage(file).then(function(im){
      if(prov==="gemini") return callGemini(key, model||"gemini-3.6-flash", im.data, im.mime);
      return callClaude(key, model||"claude-sonnet-5", im.data, im.mime);
    }).then(function(text){
      stop();
      var obj=parseAI(text);
      if(!obj||!obj.items||!obj.items.length) throw new Error("読み取り結果が空でした");
      // normalize to 10
      var items=obj.items.slice(0,10);
      while(items.length<10) items.push({before:"",answer:"",yomi:"",after:""});
      for(var i=0;i<items.length;i++){
        items[i]={ before:items[i].before||"", answer:items[i].answer||"", yomi:items[i].yomi||"", after:items[i].after||"" };
      }
      aiStatus("読み取れました！内容を確認して保存してください。","ok");
      setTimeout(function(){
        mSet.classList.remove("show");
        openEditor({ title: obj.title||"写真から作ったテスト", items:items }, true);
        $("edStatus").className="status ok";
        $("edStatus").textContent="AIが読み取りました。まちがいがないか確認してから保存してください。";
      }, 500);
    }).catch(function(err){
      stop();
      var msg=String(err&&err.message||err);
      var hint = /Failed to fetch|NetworkError|load failed|abort|timeout|時間切れ/i.test(msg)
        ? "通信がうまくいきませんでした。①Wi‑Fi/学校のネット制限、②APIキーの有効化（Generative Language API）、をご確認のうえ再度おためしください。うまくいかない時は⚙︎でAnthropic Claudeに切り替えると通ることがあります。"
        : "キー・モデル名・通信をご確認ください。";
      aiStatus("読み取れませんでした：<br>"+esc(msg)+"<br>"+hint,"err");
    });
  }

  function parseAI(text){
    if(!text) return null;
    text=text.trim();
    // strip code fences
    text=text.replace(/^```(json)?/i,"").replace(/```$/,"").trim();
    try{ return JSON.parse(text); }catch(e){}
    var m=text.match(/\{[\s\S]*\}/); if(m){ try{ return JSON.parse(m[0]); }catch(e2){} }
    return null;
  }

  function fetchTimeout(url, opts, ms){
    ms=ms||60000;
    var ac = (typeof AbortController!=="undefined") ? new AbortController() : null;
    if(ac) opts=Object.assign({}, opts, {signal:ac.signal});
    var timedOut=false;
    var t=setTimeout(function(){ timedOut=true; if(ac) ac.abort(); }, ms);
    return fetch(url,opts).then(function(r){ clearTimeout(t); return r; },
      function(e){ clearTimeout(t); if(timedOut) throw new Error("時間切れ（"+Math.round(ms/1000)+"秒）"); throw e; });
  }
  var GEMINI_SCHEMA={ type:"object", properties:{
      title:{type:"string"},
      items:{ type:"array", items:{ type:"object", properties:{
        before:{type:"string"}, answer:{type:"string"}, yomi:{type:"string"}, after:{type:"string"}
      }, required:["before","answer","yomi","after"] } }
    }, required:["title","items"] };
  function geminiExtract(j){
    try{ return j.candidates[0].content.parts.map(function(p){return p.text||"";}).join(""); }
    catch(e){ throw new Error("応答の形式が想定外です"); }
  }
  function geminiOnce(key, model, b64, mime, cfg){
    var url="https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent?key="+encodeURIComponent(key);
    var body={ contents:[{ parts:[ {text:AI_PROMPT}, {inline_data:{mime_type:mime, data:b64}} ] }], generationConfig:cfg };
    return fetchTimeout(url,{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) })
      .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, status:r.status, j:j }; }); });
  }
  function callGemini(key, model, b64, mime){
    var full={ temperature:0, maxOutputTokens:4096, responseMimeType:"application/json",
               responseSchema:GEMINI_SCHEMA, thinkingConfig:{ thinkingBudget:0 } };
    var basic={ temperature:0, maxOutputTokens:4096, responseMimeType:"application/json" };
    return geminiOnce(key,model,b64,mime,full).then(function(res){
      if(res.ok) return geminiExtract(res.j);
      // 新しい設定項目(思考オフ/スキーマ)が未対応なら、最小構成で1回だけ再試行
      if(res.status===400){
        return geminiOnce(key,model,b64,mime,basic).then(function(r2){
          if(r2.ok) return geminiExtract(r2.j);
          throw new Error((r2.j.error&&r2.j.error.message)||("HTTP "+r2.status));
        });
      }
      throw new Error((res.j.error&&res.j.error.message)||("HTTP "+res.status));
    });
  }
  function callClaude(key, model, b64, mime){
    var url="https://api.anthropic.com/v1/messages";
    var body={ model:model, max_tokens:2048, temperature:0,
      messages:[{ role:"user", content:[
        { type:"image", source:{ type:"base64", media_type:mime, data:b64 } },
        { type:"text", text:AI_PROMPT }
      ]}]};
    return fetchTimeout(url,{ method:"POST",
      headers:{ "Content-Type":"application/json", "x-api-key":key,
                "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
      body:JSON.stringify(body) })
      .then(function(r){ return r.json().then(function(j){
        if(!r.ok){ throw new Error((j.error&&j.error.message)||("HTTP "+r.status)); }
        try{ return j.content.map(function(c){return c.text||"";}).join(""); }
        catch(e){ throw new Error("応答の形式が想定外です"); }
      });});
  }

  /* close modals on backdrop tap */
  [mSet,mEdit].forEach(function(m){ m.addEventListener("click", function(e){ if(e.target===m) m.classList.remove("show"); }); });

  /* ============ init ============ */
  var last=lsGet(LS_LAST,"");
  var ids=allTests().map(function(t){return t.id;});
  state.testId = (last && ids.indexOf(last)>=0) ? last : SAMPLES[0].id;
  render();
})();
</script>
</body>
</html>
