<title>きょうの司令塔</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" />
<style>
  :root {
    --ground: #eef1f1;
    --surface: #ffffff;
    --surface-2: #f4f7f7;
    --ink: #17201f;
    --muted: #5c6b69;
    --faint: #8a9895;
    --line: #dce3e2;
    --accent: #17838f;
    --accent-ink: #0c5a63;
    --accent-soft: #dceff0;
    --warn: #b5720f;
    --warn-soft: #f9edd6;
    --urgent: #c4463a;
    --urgent-soft: #f9e4e0;
    --good: #26895f;
    --good-soft: #dcefe6;
    --shadow: 0 1px 2px rgba(20, 35, 33, 0.06), 0 6px 18px rgba(20, 35, 33, 0.06);
    --radius: 16px;
    --radius-sm: 11px;
    --font-display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0f1413;
      --surface: #171e1d;
      --surface-2: #1d2625;
      --ink: #e9eeed;
      --muted: #97a5a2;
      --faint: #6e7d7a;
      --line: #29332f;
      --accent: #46b8c6;
      --accent-ink: #7fd3dd;
      --accent-soft: #10302f;
      --warn: #e2a552;
      --warn-soft: #2c2411;
      --urgent: #e8776a;
      --urgent-soft: #2f1712;
      --good: #4dc08e;
      --good-soft: #102820;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 20px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0f1413;
    --surface: #171e1d;
    --surface-2: #1d2625;
    --ink: #e9eeed;
    --muted: #97a5a2;
    --faint: #6e7d7a;
    --line: #29332f;
    --accent: #46b8c6;
    --accent-ink: #7fd3dd;
    --accent-soft: #10302f;
    --warn: #e2a552;
    --warn-soft: #2c2411;
    --urgent: #e8776a;
    --urgent-soft: #2f1712;
    --good: #4dc08e;
    --good-soft: #102820;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 20px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .app {
    height: 100dvh;
    max-width: 520px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 8px);
    gap: 10px;
    overflow: hidden;
  }

  /* ---- top bar ---- */
  .topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 2px; }
  .date { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .date .d-num { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.01em; }
  .date .d-dow { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--muted); }
  .date .d-holiday {
    font-size: 12px; font-weight: 700; color: var(--urgent);
    background: var(--urgent-soft); padding: 2px 8px; border-radius: 999px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw;
  }
  .sync { display: flex; align-items: center; gap: 8px; flex: none; }
  .sync .stamp { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
    box-shadow: var(--shadow);
  }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn.spin svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- agenda card (next event + later/all-day rows) ---- */
  .block.agenda { flex: none; overflow: hidden; }
  .hero { position: relative; padding: 9px 15px 9px 16px; }
  .hero::before { content: ""; position: absolute; inset: 7px auto 7px 0; width: 4px; border-radius: 0 3px 3px 0; background: var(--accent); }
  .hero[data-state="soon"]::before { background: var(--warn); }
  .hero[data-state="imminent"]::before { background: var(--urgent); }
  .hero[data-state="now"]::before { background: var(--good); }
  .hero-line { display: flex; align-items: center; gap: 10px; }
  .hero-time {
    flex: none; font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1.15;
    letter-spacing: -0.01em; font-variant-numeric: tabular-nums; color: var(--ink);
  }
  .hero-end { font-size: 13px; font-weight: 700; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
  .hero-title {
    flex: 1; min-width: 0; font-weight: 700; font-size: 14.5px; line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hero-cal { color: var(--faint); font-weight: 500; font-size: 12px; }
  .hero-cd {
    flex: none; font-size: 11.5px; font-weight: 700; white-space: nowrap;
    color: var(--accent-ink); background: var(--accent-soft); padding: 2px 9px; border-radius: 999px;
  }
  .hero[data-state="soon"] .hero-cd { color: #fff; background: var(--warn); }
  .hero[data-state="imminent"] .hero-cd { color: #fff; background: var(--urgent); }
  .hero[data-state="imminent"] .hero-time { color: var(--urgent); }
  .hero[data-state="now"] .hero-cd { color: #fff; background: var(--good); }
  .hero[data-state="now"] .hero-time { color: var(--good); }
  .hero-empty { padding: 2px 0; }
  .hero-empty .big { font-family: var(--font-display); font-weight: 700; font-size: 14.5px; }
  .hero-empty .sub { font-size: 12px; color: var(--muted); }
  /* all-day events → chips in the header (they behave like tasks) */
  .allday-chips { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; margin-left: 8px; }
  .ac-chip {
    font-size: 10.5px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft);
    padding: 2px 9px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 128px;
  }
  .ac-chip.more { color: var(--muted); background: var(--surface-2); }
  /* later timed events: readable full-width rows, only this area scrolls when long */
  .ev-list { display: flex; flex-direction: column; max-height: 172px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .ev-row { position: relative; display: flex; align-items: center; gap: 11px; padding: 8px 15px; border-top: 1px solid var(--line); }
  .ev-row::before { content: ""; position: absolute; inset: 6px auto 6px 0; width: 4px; border-radius: 0 3px 3px 0; background: var(--line); }
  .ev-row[data-state="soon"]::before { background: var(--warn); }
  .ev-row[data-state="imminent"]::before { background: var(--urgent); }
  .ev-row[data-state="now"]::before { background: var(--good); }
  .ev-time { flex: none; font-family: var(--font-display); font-weight: 800; font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .ev-end { font-size: 11px; font-weight: 700; color: var(--muted); margin-left: 3px; }
  .ev-row.allday .ev-time { font-size: 12.5px; color: var(--accent-ink); }
  .ev-title { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev-cd { flex: none; font-size: 11.5px; font-weight: 700; color: var(--accent-ink); white-space: nowrap; }
  .ev-row[data-state="soon"] .ev-cd { color: var(--warn); }
  .ev-row[data-state="imminent"] .ev-cd { color: var(--urgent); }
  .ev-more { display: block; padding: 7px 15px; font-size: 12px; color: var(--accent-ink); border-top: 1px solid var(--line); text-decoration: none; font-weight: 700; }

  /* ---- section blocks ---- */
  .block {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    display: flex; flex-direction: column; min-height: 0;
  }
  .block.sched, .block.mail { flex: none; }
  .block.tasks { flex: 1 1 auto; min-height: 96px; }
  .b-head {
    display: flex; align-items: center; gap: 8px; padding: 9px 13px 7px;
  }
  .b-head .h-ic { color: var(--accent); display: inline-flex; flex: none; }
  .b-title { font-family: var(--font-display); font-weight: 700; font-size: 13.5px; letter-spacing: 0.01em; }
  .b-count {
    margin-left: auto; font-size: 12px; font-weight: 700; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .b-count b { color: var(--ink); font-size: 14px; }
  .chip-sync { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px; letter-spacing: 0.02em; }
  .chip-sync.ok { color: var(--good); background: var(--good-soft); }
  .chip-sync.local { color: var(--warn); background: var(--warn-soft); }
  .b-list { display: flex; flex-direction: column; }
  /* tasks: two vertical columns (タスク | LINE返信) */
  .tasks .b-list { flex: 1; min-height: 0; display: flex; flex-direction: row; overflow: hidden; }
  .tasks .b-list .empty { flex: 1; }
  .grp-col { flex: 1 1 0; min-width: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; }
  .grp-col + .grp-col { border-left: 1px solid var(--line); }
  .grp-head {
    font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing: 0.06em;
    color: var(--muted); padding: 8px 12px 5px; display: flex; align-items: center; gap: 6px;
    position: sticky; top: 0; background: var(--surface); z-index: 1;
  }
  .grp-head.line { color: #05852b; }
  :root[data-theme="dark"] .grp-head.line, :root:not([data-theme="light"]) .grp-head.line { color: #5fe08a; }
  .grp-head .grp-n {
    font-size: 10px; font-weight: 700; color: var(--faint);
    background: var(--surface-2); border-radius: 999px; padding: 0 7px; min-width: 18px; text-align: center;
  }
  .grp-none { padding: 6px 12px 12px; color: var(--faint); font-size: 12px; }
  .grp-col .task { padding: 9px 10px 9px 12px; gap: 9px; }
  .grp-col .task .del { font-size: 18px; padding: 2px 2px; }

  .row {
    display: flex; align-items: center; gap: 10px; padding: 8px 13px;
    border-top: 1px solid var(--line); position: relative;
  }
  .row:first-child { border-top: 0; }
  .row .stripe { position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 0 3px 3px 0; background: var(--line); }
  .row.u-imminent .stripe { background: var(--urgent); }
  .row.u-soon .stripe { background: var(--warn); }
  .row.u-ok .stripe { background: var(--accent); }
  .row .r-time {
    font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--ink);
    min-width: 42px; font-variant-numeric: tabular-nums; flex: none;
  }
  .row .r-time.allday { color: var(--accent-ink); font-size: 11px; min-width: 42px; }
  .row .r-body { min-width: 0; flex: 1; }
  .row .r-title {
    font-size: 14px; font-weight: 500; line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row .r-sub { font-size: 11.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* mail rows (compact) */
  .mail .b-head { padding-bottom: 4px; }
  .mail .row { padding-top: 5px; padding-bottom: 5px; }
  .mail .r-title { line-height: 1.25; }
  .mail .r-from { line-height: 1.15; }
  .row.mailrow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .row.mailrow.important .dot { background: var(--urgent); }
  .row.mailrow .r-from { font-size: 11.5px; color: var(--muted); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chev { color: var(--faint); flex: none; }

  /* task rows */
  .task {
    display: flex; align-items: center; gap: 11px; padding: 9px 13px;
    border-top: 1px solid var(--line);
  }
  .task:first-child { border-top: 0; }
  .check {
    width: 23px; height: 23px; border-radius: 7px; flex: none;
    border: 2px solid var(--faint); background: transparent;
    display: inline-flex; align-items: center; justify-content: center; color: #fff;
    transition: background 0.12s, border-color 0.12s;
  }
  .check svg { opacity: 0; }
  .task.done .check { background: var(--good); border-color: var(--good); }
  .task.done .check svg { opacity: 1; }
  .task .t-body { flex: 1; min-width: 0; }
  .task .t-title { font-size: 14.5px; line-height: 1.3; word-break: break-word; }
  .task.done .t-title { color: var(--faint); text-decoration: line-through; }
  .task .kind {
    font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px; letter-spacing: 0.02em;
    flex: none; margin-top: 1px;
  }
  .kind.line { color: #05852b; background: rgba(6, 199, 85, 0.14); }
  .kind.task { color: var(--accent-ink); background: var(--accent-soft); }
  .kind.over { color: #fff; background: var(--urgent); }
  :root[data-theme="dark"] .kind.line, :root:not([data-theme="light"]) .kind.line { color: #5fe08a; }
  /* overdue (carried over from a previous day) */
  .task.overdue { background: var(--urgent-soft); }
  .task.overdue .t-title { color: var(--urgent); font-weight: 700; }
  .task.overdue .check { border-color: var(--urgent); }
  .cnt-over { color: #fff; background: var(--urgent); font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; margin-left: 4px; }
  .task .del {
    border: 0; background: transparent; color: var(--faint); font-size: 20px; line-height: 1;
    padding: 2px 4px; flex: none; opacity: 0.7;
  }
  .task .del:active { color: var(--urgent); }

  .empty { padding: 14px 13px; color: var(--faint); font-size: 13px; text-align: center; }
  .note {
    padding: 9px 13px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line);
    display: flex; gap: 8px; align-items: flex-start; line-height: 1.4;
  }
  .note.reauth { color: var(--urgent); }
  .note a { color: var(--accent-ink); font-weight: 700; text-decoration: underline; }

  /* add bar inside tasks */
  .addbar {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-top: 1px solid var(--line); flex: none; background: var(--surface-2);
    border-radius: 0 0 var(--radius) var(--radius);
  }
  .kindtoggle { display: flex; gap: 4px; flex: none; }
  .kindtoggle button {
    font-family: var(--font-display); font-size: 11px; font-weight: 700; padding: 6px 8px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  }
  .kindtoggle button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .addbar input {
    flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface);
    border-radius: 9px; padding: 9px 11px; font-size: 15px; color: var(--ink); font-family: inherit;
  }
  .addbar input::placeholder { color: var(--faint); }
  .addbar .add {
    flex: none; width: 38px; height: 38px; border-radius: 10px; border: 0;
    background: var(--accent); color: #fff; font-size: 22px; line-height: 1; display: inline-flex;
    align-items: center; justify-content: center;
  }
  .addbar .add:active { transform: scale(0.94); }

  /* task due-date row */
  .task-dates {
    display: flex; align-items: center; gap: 6px; flex: none; padding: 6px 10px 0;
    font-size: 12px; color: var(--muted);
  }
  .task-dates[hidden] { display: none; }
  .task-dates .td-label { font-weight: 700; flex: none; }
  .task-dates input[type="date"], .task-dates input[type="time"] {
    flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface);
    border-radius: 8px; padding: 5px 8px; font-size: 13px; color: var(--ink); font-family: inherit;
  }
  .task-dates .td-sep { flex: none; color: var(--faint); }
  .task-dates .td-clear { flex: none; border: 0; background: transparent; color: var(--faint); font-size: 18px; padding: 0 4px; }

  /* header add-event button */
  .head-add {
    flex: none; margin-left: 8px; font-family: var(--font-display); font-weight: 700; font-size: 11px;
    padding: 3px 9px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  .head-add:active { transform: scale(0.95); }

  /* modal */
  .modal {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center;
    background: rgba(10, 20, 19, 0.45); padding: 0 12px calc(env(safe-area-inset-bottom) + 12px);
  }
  .modal[hidden] { display: none; }
  .modal-card {
    width: 100%; max-width: 460px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: var(--shadow); padding: 14px 15px 16px; margin-bottom: 6px;
    display: flex; flex-direction: column; gap: 11px;
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; font-family: var(--font-display); font-weight: 800; font-size: 16px; }
  .modal-x { border: 0; background: transparent; color: var(--muted); font-size: 24px; line-height: 1; padding: 0 4px; }
  .fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .fld.chk { flex-direction: row; align-items: center; gap: 8px; }
  .fld input[type="text"], .fld input[type="date"], .fld input[type="time"] {
    border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 9px 11px;
    font-size: 15px; color: var(--ink); font-family: inherit; font-weight: 400;
  }
  .fld input::placeholder { color: var(--faint); }
  .fld.chk input { width: 20px; height: 20px; }
  .fld-row { display: flex; gap: 10px; }
  .fld-row .fld { flex: 1; }
  .fld-row[hidden] { display: none; }
  .modal-note { font-size: 12px; color: var(--urgent); line-height: 1.4; }
  .modal-note[hidden] { display: none; }
  .modal-go {
    border: 0; background: var(--accent); color: #fff; font-family: var(--font-display); font-weight: 700;
    font-size: 15px; padding: 12px; border-radius: 11px; margin-top: 2px;
  }
  .modal-go:active { transform: scale(0.99); }
  .modal-go:disabled { opacity: 0.55; }

  /* due badge on task rows */
  .t-due { font-size: 10px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); padding: 1px 6px; border-radius: 999px; flex: none; margin-top: 1px; white-space: nowrap; }
  .task.overdue .t-due { color: #fff; background: var(--urgent); }

  /* ---- dock ---- */
  .dock { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: none; }
  .dock a, .dock button {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
    box-shadow: var(--shadow); padding: 9px 4px 8px; color: var(--muted);
    font-family: var(--font-display); font-weight: 700; font-size: 11px;
  }
  .dock a:active, .dock button:active { transform: scale(0.96); }
  .dock .ic { display: inline-flex; }
  .dock .line-ic { color: #06c755; }
  .dock .mail-ic { color: #ea4335; }
  .dock .cal-ic { color: #4285f4; }

  .skl { color: var(--faint); font-size: 13px; padding: 10px 13px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="date">
      <span class="d-num" id="dNum">—</span>
      <span class="d-dow" id="dDow"></span>
      <span class="d-holiday" id="dHoliday" hidden></span>
    </div>
    <div class="sync">
      <span class="stamp" id="stamp"></span>
    </div>
  </header>

  <section class="block agenda">
    <div class="b-head">
      <span class="h-ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg></span>
      <span class="b-title">きょうの予定</span>
      <span class="allday-chips" id="alldayChips" hidden></span>
      <span class="b-count" id="schedCount"></span>
      <button class="head-add" id="addEventBtn" aria-label="予定を追加">＋予定</button>
    </div>
    <div class="hero" id="hero" data-state="ok">
      <div id="heroContent"><div class="hero-empty"><span class="sub">読み込み中…</span></div></div>
    </div>
    <div class="ev-list" id="schedList"></div>
  </section>

  <section class="block mail">
    <div class="b-head">
      <span class="h-ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg></span>
      <span class="b-title">要チェックのメール</span>
      <span class="b-count" id="mailCount"></span>
    </div>
    <div class="b-list" id="mailList"><div class="skl">読み込み中…</div></div>
  </section>

  <section class="block tasks">
    <div class="b-head">
      <span class="h-ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17.5 20 6.5"/></svg></span>
      <span class="b-title">きょう やること</span>
      <span class="chip-sync" id="syncChip" hidden></span>
      <span class="b-count" id="taskCount"></span>
    </div>
    <div class="b-list" id="taskList"><div class="skl">読み込み中…</div></div>
    <div class="task-dates" id="taskDates">
      <span class="td-label">期限</span>
      <input id="taskDue" type="date" aria-label="期限（開始）" />

      <button type="button" class="td-clear" id="taskDueClear" aria-label="日付をクリア">×</button>
    </div>
    <div class="task-dates" id="taskTimes">
      <span class="td-label">時刻</span>
      <input id="taskStart" type="time" aria-label="開始時刻（任意）" />
      <span class="td-sep">〜</span>
      <input id="taskEnd" type="time" aria-label="終了時刻（任意）" />
      <button type="button" class="td-clear" id="taskTimeClear" aria-label="時刻をクリア">×</button>
    </div>
    <div class="addbar">
      <div class="kindtoggle" role="group" aria-label="種類">
        <button type="button" id="kTask" aria-pressed="true">タスク</button>
        <button type="button" id="kLine" aria-pressed="false">LINE返信</button>
      </div>
      <input id="taskInput" type="text" inputmode="text" placeholder="やること・返信を追加…" autocomplete="off" />
      <button class="add" id="addBtn" aria-label="追加">＋</button>
    </div>
  </section>

</div>

<div class="modal" id="evtModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="evtModalTitle">
    <div class="modal-head"><span id="evtModalTitle">予定を追加</span><button class="modal-x" id="evtCancel" aria-label="閉じる">×</button></div>
    <label class="fld"><span>タイトル</span><input id="evtTitle" type="text" placeholder="例：授業参観" autocomplete="off" /></label>
    <label class="fld"><span>日付</span><input id="evtDate" type="date" /></label>
    <label class="fld chk"><input id="evtAllday" type="checkbox" /><span>終日</span></label>
    <div class="fld-row" id="evtTimeRow">
      <label class="fld"><span>開始</span><input id="evtStart" type="time" /></label>
      <label class="fld"><span>終了</span><input id="evtEnd" type="time" /></label>
    </div>
    <div class="modal-note" id="evtNote" hidden></div>
    <button class="modal-go" id="evtSave">カレンダーに追加</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var GOOGLE_ACCOUNT = "89ryokinishida@gmail.com";
  var CAL_SERVER = "Google Calendar";
  var MAIL_SERVER = "Gmail";
  var MAIL_QUERY = "is:unread in:inbox -category:promotions -category:social";
  var TASK_CAL_NAME = "タスク管理";
  var DOW = ["日", "月", "火", "水", "木", "金", "土"];

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmtTime(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function todayStr() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function nextDayStr(s) { var d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + 1); return d.toISOString().slice(0, 10); }
  function fmtDueShort(s) { var p = (s || "").split("-"); return p.length === 3 ? (Number(p[1]) + "/" + Number(p[2])) : ""; }
  function addOneHour(hhmm) { var p = (hhmm || "").split(":"); var h = (Number(p[0]) + 1) % 24; return pad(h) + ":" + (p[1] || "00"); }
  // create a Google Calendar event via mcp; returns the created event payload (or throws)
  function gcalCreate(calendarId, opts) {
    var mcp = window.__mcp;
    if (!mcp) return Promise.reject({ code: "server_not_connected" });
    var input = { summary: opts.summary, calendarId: calendarId };
    if (opts.allDay) {
      input.allDay = true;
      input.startTime = opts.date + "T00:00:00Z";
      input.endTime = nextDayStr(opts.endDate || opts.date) + "T00:00:00Z";
    } else {
      input.startTime = opts.date + "T" + opts.start + ":00+09:00";
      input.endTime = opts.date + "T" + opts.end + ":00+09:00";
      input.timeZone = "Asia/Tokyo";
    }
    return mcp.callTool(CAL_SERVER, "create_event", input).then(function (r) { return (r && r.payload) || {}; });
  }

  // ---------- state ----------
  var calEvents = {};      // calendarId -> [events]
  var calStatus = {};      // calendarId -> "ok"|errcode
  var calNames = {};       // calendarId -> summary
  var mailData = null;     // payload
  var mailStatus = "load"; // "ok"|"load"|errcode
  var todos = [];          // {id,title,done,kind,createdAt}
  var lastMcpUpdate = 0;
  var kindSel = "task";

  // ---------- date header ----------
  function renderHeader() {
    var now = new Date();
    $("dNum").textContent = (now.getMonth() + 1) + "月" + now.getDate() + "日";
    $("dDow").textContent = "(" + DOW[now.getDay()] + ")";
  }

  function todayBounds() {
    var s = new Date(); s.setHours(0, 0, 0, 0);
    var e = new Date(s); e.setDate(e.getDate() + 1);
    return { startTime: s.toISOString(), endTime: e.toISOString(), key: s.toDateString() };
  }
  var dayKey = todayBounds().key;

  // ---------- schedule / hero ----------
  function evStart(e) { return e.start && (e.start.dateTime || e.start.date); }
  function isAllDay(e) { return !!(e.start && e.start.date && !e.start.dateTime); }
  function startMs(e) {
    if (isAllDay(e)) return 0;
    return new Date(e.start.dateTime).getTime();
  }
  function mergedEvents() {
    var all = [];
    Object.keys(calEvents).forEach(function (id) {
      (calEvents[id] || []).forEach(function (e) {
        if (e && e.status !== "cancelled" && evStart(e)) all.push(e);
      });
    });
    all.sort(function (a, b) { return startMs(a) - startMs(b); });
    return all;
  }
  function humanGap(ms) {
    var m = Math.round(ms / 60000);
    if (m < 1) return "まもなく";
    if (m < 60) return "あと" + m + "分";
    var h = Math.floor(m / 60), mm = m % 60;
    return "あと" + h + "時間" + mm + "分";
  }
  function shortGap(ms) {
    var m = Math.round(ms / 60000);
    if (m < 1) return "まもなく";
    if (m < 60) return m + "分";
    var h = Math.floor(m / 60), mm = m % 60;
    return h + "時間" + mm + "分";
  }

  var heroEv = null;
  function renderHero() {
    var hero = $("hero"), content = $("heroContent");
    heroEv = null;
    var anyCal = Object.keys(calStatus).length > 0;
    var errored = anyCal && Object.keys(calStatus).every(function (k) { return calStatus[k] !== "ok"; });

    if (!window.__mcpReady && !anyCal) {
      hero.setAttribute("data-state", "ok");
      content.innerHTML = '<div class="hero-empty"><span class="sub">Googleカレンダーを読み込み中…</span></div>';
      return;
    }
    if (errored) {
      hero.setAttribute("data-state", "ok");
      content.innerHTML = '<div class="hero-empty"><span class="sub">' + connectMsg(firstErr(calStatus)) + "</span></div>";
      return;
    }

    var all = mergedEvents();
    var timed = all.filter(function (e) { return !isAllDay(e); });
    var now = Date.now();
    var ongoing = null, next = null;
    for (var i = 0; i < timed.length; i++) {
      var st = new Date(timed[i].start.dateTime).getTime();
      var en = timed[i].end && timed[i].end.dateTime ? new Date(timed[i].end.dateTime).getTime() : st + 3600000;
      if (st <= now && en > now) { ongoing = timed[i]; break; }
      if (st > now && !next) next = timed[i];
    }

    var ev = ongoing || next;
    if (!ev) {
      hero.setAttribute("data-state", "ok");
      var msg = all.length ? "この後の予定はありません" : "きょうの予定はありません";
      var sub = all.length ? "おつかれさま。やることに集中" : "予定なし。今日は身軽です";
      content.innerHTML = '<div class="hero-empty"><div><div class="big">' + msg + '</div><div class="sub">' + sub + "</div></div></div>";
      return;
    }
    heroEv = ev;

    var st2 = new Date(ev.start.dateTime).getTime();
    var state = "ok", cd = "";
    if (ongoing) {
      state = "now";
      cd = "進行中";
    } else {
      var gap = st2 - now;
      if (gap <= 15 * 60000) state = "imminent";
      else if (gap <= 60 * 60000) state = "soon";
      cd = humanGap(gap);
    }
    hero.setAttribute("data-state", state);

    var calName = (calNames[ev.__cal] && !ev.__primary) ? esc(calNames[ev.__cal]) : (ev.location ? esc(ev.location) : "");
    var calSpan = calName ? '<span class="hero-cal"> ・ ' + calName + "</span>" : "";
    var heroEnd = ev.end && ev.end.dateTime ? '<span class="hero-end">〜' + fmtTime(new Date(ev.end.dateTime)) + "</span>" : "";
    content.innerHTML =
      '<div class="hero-line">' +
        '<span class="hero-time">' + fmtTime(new Date(ev.start.dateTime)) + heroEnd + "</span>" +
        '<span class="hero-title">' + esc(ev.summary || "(タイトルなし)") + calSpan + "</span>" +
        '<span class="hero-cd">' + cd + "</span>" +
      "</div>";
  }

  function renderSchedule() {
    var box = $("schedList"), cnt = $("schedCount"), chips = $("alldayChips");
    function clearChips() { chips.innerHTML = ""; chips.hidden = true; }
    var anyCal = Object.keys(calStatus).length > 0;
    var errored = anyCal && Object.keys(calStatus).every(function (k) { return calStatus[k] !== "ok"; });
    if ((!anyCal && !window.__mcpReady) || errored) { box.innerHTML = ""; clearChips(); cnt.textContent = ""; return; }

    var all = mergedEvents();
    var now = Date.now();
    if (!all.length) { box.innerHTML = ""; clearChips(); cnt.textContent = ""; return; }

    var upcoming = all.filter(function (e) {
      if (isAllDay(e)) return true;
      var en = e.end && e.end.dateTime ? new Date(e.end.dateTime).getTime() : startMs(e) + 3600000;
      return en > now;
    });
    var remaining = upcoming.filter(function (e) { return !isAllDay(e); }).length;
    cnt.innerHTML = "残り <b>" + remaining + "</b> 件";

    var pool = (upcoming.length ? upcoming : all).filter(function (e) { return e !== heroEv; });
    var timed = pool.filter(function (e) { return !isAllDay(e); });
    var allday = pool.filter(function (e) { return isAllDay(e); });

    // all-day events → chips beside the header (they're basically tasks)
    if (allday.length) {
      chips.hidden = false;
      var CMAX = 2;
      var cShow = allday.length > CMAX ? allday.slice(0, CMAX - 1) : allday.slice(0, CMAX);
      var chtml = cShow.map(function (e) {
        return '<span class="ac-chip">' + esc(e.summary || "(予定)") + "</span>";
      }).join("");
      if (allday.length > CMAX) chtml += '<span class="ac-chip more">+' + (allday.length - (CMAX - 1)) + "</span>";
      chips.innerHTML = chtml;
    } else { clearChips(); }

    // timed events → full list; only this area scrolls when there are many
    if (!timed.length) { box.innerHTML = ""; return; }
    box.innerHTML = timed.map(function (e) {
      var st = new Date(e.start.dateTime).getTime();
      var gap = st - now, u = "ok";
      if (gap <= 15 * 60000) u = "imminent";
      else if (gap <= 60 * 60000) u = "soon";
      var end = e.end && e.end.dateTime ? '<span class="ev-end">〜' + fmtTime(new Date(e.end.dateTime)) + "</span>" : "";
      return '<div class="ev-row" data-state="' + u + '">' +
        '<span class="ev-time">' + fmtTime(new Date(e.start.dateTime)) + end + "</span>" +
        '<span class="ev-title">' + esc(e.summary || "(タイトルなし)") + "</span>" +
        '<span class="ev-cd">' + shortGap(gap) + "</span></div>";
    }).join("");
  }

  // ---------- mail ----------
  function senderName(s) {
    if (!s) return "";
    var m = /^\s*"?([^"<]+?)"?\s*</.exec(s);
    if (m) return m[1].trim();
    var at = s.indexOf("@");
    return at > 0 ? s.slice(0, at) : s;
  }
  function threadLatest(t) {
    var msgs = t.messages || [];
    var best = msgs[0];
    for (var i = 1; i < msgs.length; i++) {
      if (new Date(msgs[i].date) >= new Date(best.date)) best = msgs[i];
    }
    return best || {};
  }
  function renderMail() {
    var box = $("mailList"), cnt = $("mailCount");
    if (mailStatus === "load" && !mailData) { box.innerHTML = '<div class="skl">読み込み中…</div>'; return; }
    if (mailStatus !== "ok" && mailStatus !== "load") {
      box.innerHTML = '<div class="note ' + (isReauth(mailStatus) ? "reauth" : "") + '">' + connectMsg(mailStatus) + "</div>";
      cnt.textContent = ""; return;
    }
    var threads = (mailData && mailData.threads) || [];
    if (!threads.length) { box.innerHTML = '<div class="empty">未読なし。受信箱スッキリ ✓</div>'; cnt.innerHTML = ""; return; }

    var items = threads.map(function (t) {
      var m = threadLatest(t);
      var labels = m.labelIds || [];
      return {
        id: t.id, subject: m.subject || "(件名なし)", from: senderName(m.sender),
        date: m.date ? new Date(m.date).getTime() : 0,
        important: labels.indexOf("IMPORTANT") >= 0
      };
    });
    items.sort(function (a, b) {
      if (a.important !== b.important) return a.important ? -1 : 1;
      return b.date - a.date;
    });
    var impCount = items.filter(function (i) { return i.important; }).length;
    cnt.innerHTML = "<b>" + items.length + "</b> 件" + (impCount ? " ・ 重要" + impCount : "");

    var show = items.slice(0, 3);
    var html = show.map(function (i) {
      var href = "https://mail.google.com/mail/u/0/#inbox/" + encodeURIComponent(i.id);
      return '<a class="row mailrow ' + (i.important ? "important" : "") + '" href="' + href + '" target="_blank" rel="noopener">' +
        '<span class="dot"></span>' +
        '<div class="r-body"><div class="r-title">' + esc(i.subject) + "</div>" +
        '<div class="r-from">' + esc(i.from) + "</div></div>" +
        '<span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span></a>';
    }).join("");
    if (items.length > 3) {
      html += '<a class="note" href="https://mail.google.com/mail/u/0/#inbox" target="_blank" rel="noopener">ほか ' + (items.length - 3) + " 件をGmailで見る →</a>";
    }
    box.innerHTML = html;
  }

  // ---------- error copy ----------
  function isReauth(code) { return code === "needs_reauth" || code === "server_not_connected" || code === "selection_required"; }
  function firstErr(map) {
    var k = Object.keys(map).filter(function (x) { return map[x] !== "ok"; })[0];
    return k ? map[k] : "upstream_error";
  }
  function connectMsg(code) {
    if (code === "needs_reauth") return 'Googleの再接続が必要です（claude.ai 設定 → コネクタ）';
    if (code === "server_not_connected") return 'Googleコネクタを追加してください（claude.ai 設定 → コネクタ）';
    if (code === "selection_required") return 'アカウントを選択してください';
    if (code === "not_granted" || code === "capability_disabled") return 'この画面ではGoogleに接続できません';
    return '読み込めませんでした。「更新」でもう一度お試しください';
  }

  // ---------- tasks ----------
  var db = null, usingDb = false;
  var LS_KEY = "adhd_dash_todos_v1";
  function genId() { return "l" + Date.now() + Math.random().toString(36).slice(2, 6); }
  function setSync(state) {
    var c = $("syncChip"); if (!c) return;
    c.hidden = false;
    if (state === "db") { c.textContent = "☁ 同期中"; c.className = "chip-sync ok"; }
    else { c.textContent = "この端末のみ"; c.className = "chip-sync local"; }
  }
  function lsLoad() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) { return []; } }
  function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify(todos)); } catch (e) {} }

  function dueKey(t) { return t.due || "9999-99-99"; }
  function sortTodos(arr) {
    return arr.slice().sort(function (a, b) {
      if (!!a.done !== !!b.done) return a.done ? 1 : -1;
      var da = dueKey(a), dbb = dueKey(b);
      if (da !== dbb) return da < dbb ? -1 : 1;
      return (a.createdAt || 0) - (b.createdAt || 0);
    });
  }
  function renderTasks() {
    var box = $("taskList"), cnt = $("taskCount");
    var TODAY = todayStr();
    function over(t) { return !t.done && t.due && t.due < TODAY; }
    var remain = todos.filter(function (t) { return !t.done; }).length;
    var overdue = todos.filter(over).length;
    cnt.innerHTML = "残り <b>" + remain + "</b> 件" +
      (overdue ? ' <span class="cnt-over">繰越 ' + overdue + "</span>" : "");
    if (!todos.length) {
      box.innerHTML = '<div class="empty">やること・LINEの返信を下から追加<br>頭の中を空っぽにしよう</div>';
      return;
    }
    function row(t) {
      var isOver = over(t);
      var dueBadge = "";
      if (t.due) {
        var dtxt = fmtDueShort(t.due) + (t.dueEnd && t.dueEnd !== t.due ? "〜" + fmtDueShort(t.dueEnd) : "");
        if (t.dtime) dtxt += " " + t.dtime;
        dueBadge = '<span class="t-due">' + dtxt + "</span>";
      }
      return '<div class="task ' + (t.done ? "done" : "") + (isOver ? " overdue" : "") + '" data-id="' + esc(t.id) + '">' +
        '<button class="check" data-act="toggle" aria-label="完了"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17.5 20 6.5"/></svg></button>' +
        '<div class="t-body"><span class="t-title">' + esc(t.title) + "</span></div>" +
        dueBadge +
        '<button class="del" data-act="del" aria-label="削除">×</button></div>';
    }
    var groups = [
      { key: "task", label: "タスク", items: sortTodos(todos.filter(function (t) { return t.kind !== "line"; })) },
      { key: "line", label: "LINE返信", items: sortTodos(todos.filter(function (t) { return t.kind === "line"; })) }
    ];
    box.innerHTML = groups.map(function (g) {
      var open = g.items.filter(function (t) { return !t.done; }).length;
      var body = g.items.length ? g.items.map(row).join("") : '<div class="grp-none">なし</div>';
      return '<div class="grp-col">' +
        '<div class="grp-head ' + g.key + '">' + g.label + ' <span class="grp-n">' + open + "</span></div>" +
        body + "</div>";
    }).join("");
  }

  function addTodo(title, kind, due, dueEnd, dtime, dtimeEnd) {
    title = (title || "").trim();
    if (!title) return;
    due = due || ""; dueEnd = dueEnd || ""; dtime = dtime || ""; dtimeEnd = dtimeEnd || "";
    if (dueEnd && due && dueEnd < due) { var tmp = due; due = dueEnd; dueEnd = tmp; }
    // a start time makes it a timed single-day event (on the start date)
    if (dtime) { dueEnd = ""; if (!dtimeEnd || dtimeEnd <= dtime) dtimeEnd = addOneHour(dtime); }
    var item = { title: title, kind: kind, done: false, createdAt: Date.now(), due: due, dueEnd: dueEnd, dtime: dtime, dtimeEnd: dtimeEnd, eventId: "" };
    // add a dated task to the タスク管理 calendar (timed if a time is set, else all-day)
    function pushToCalendar(onId) {
      if (kind !== "task" || !due || !window.__taskCalId || !window.__mcp) return;
      var opts = dtime
        ? { summary: title, allDay: false, date: due, start: dtime, end: dtimeEnd }
        : { summary: title, allDay: true, date: due, endDate: dueEnd || due };
      gcalCreate(window.__taskCalId, opts)
        .then(function (ev) {
          if (ev && ev.id) { item.eventId = ev.id; onId(ev.id); }
          if (window.__mcp && window.__mcp.invalidate) { try { window.__mcp.invalidate(CAL_SERVER); } catch (e) {} }
        })
        .catch(function () { /* task is saved even if the calendar write fails */ });
    }
    if (usingDb && db) {
      var ref = db.collection("todos").doc();
      item.id = ref.id;
      todos.push(item); renderTasks();
      ref.set({ title: title, kind: kind, done: false, createdAt: item.createdAt, due: due, dueEnd: dueEnd, dtime: dtime, dtimeEnd: dtimeEnd, eventId: "" })
        .then(function () { dbRefresh(); pushToCalendar(function (eid) { db.doc("todos/" + item.id).update({ eventId: eid }).catch(function () {}); }); })
        .catch(function () {
          todos = todos.filter(function (x) { return x.id !== item.id; });
          renderTasks();
          alert("保存できませんでした。通信を確認してもう一度お試しください。");
        });
    } else {
      item.id = genId();
      todos.push(item); lsSave(); renderTasks();
      pushToCalendar(function () { lsSave(); });
    }
  }
  function toggleTodo(id) {
    var t = todos.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    var nv = !t.done;
    t.done = nv; renderTasks(); // optimistic
    if (usingDb && db) {
      db.doc("todos/" + id).update({ done: nv }).then(function () { dbRefresh(); }).catch(function () { t.done = !nv; renderTasks(); });
    } else {
      lsSave();
    }
  }
  function delTodo(id) {
    var removed = todos.filter(function (x) { return x.id === id; })[0];
    todos = todos.filter(function (x) { return x.id !== id; });
    renderTasks(); // optimistic
    // also remove its all-day event from the タスク管理 calendar
    if (removed && removed.eventId && window.__taskCalId && window.__mcp) {
      window.__mcp.callTool(CAL_SERVER, "delete_event", { eventId: removed.eventId, calendarId: window.__taskCalId })
        .then(function () { if (window.__mcp.invalidate) { try { window.__mcp.invalidate(CAL_SERVER); } catch (e) {} } })
        .catch(function () {});
    }
    if (usingDb && db) {
      db.doc("todos/" + id).delete().then(function () { dbRefresh(); }).catch(function () { if (removed) { todos.push(removed); renderTasks(); } });
    } else {
      lsSave();
    }
  }

  // task list interactions (event delegation)
  $("taskList").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var row = e.target.closest(".task"); if (!row) return;
    var id = row.getAttribute("data-id");
    if (btn.getAttribute("data-act") === "toggle") toggleTodo(id);
    else if (btn.getAttribute("data-act") === "del") delTodo(id);
  });
  function submitTask() {
    var isTask = kindSel === "task";
    var due = isTask ? ($("taskDue").value || "") : "";
    var dueEnd = isTask ? ($("taskDueEnd").value || "") : "";
    var dtime = isTask ? ($("taskStart").value || "") : "";
    var dtimeEnd = isTask ? ($("taskEnd").value || "") : "";
    addTodo($("taskInput").value, kindSel, due, dueEnd, dtime, dtimeEnd);
    $("taskInput").value = ""; $("taskInput").focus();
  }
  $("addBtn").addEventListener("click", submitTask);
  // Enter では登録しない（＋ボタンでのみ登録）
  function setKind(k) {
    kindSel = k;
    $("kTask").setAttribute("aria-pressed", k === "task" ? "true" : "false");
    $("kLine").setAttribute("aria-pressed", k === "line" ? "true" : "false");
    $("taskDates").hidden = (k !== "task");
    $("taskTimes").hidden = (k !== "task");
    $("taskInput").placeholder = k === "line" ? "誰に返信する？（例：田中さんにLINE）" : "やること・返信を追加…";
    $("taskInput").focus();
  }
  $("kTask").addEventListener("click", function () { setKind("task"); });
  $("kLine").addEventListener("click", function () { setKind("line"); });
  $("taskDueClear").addEventListener("click", function () { $("taskDue").value = ""; $("taskDueEnd").value = ""; });
  $("taskTimeClear").addEventListener("click", function () { $("taskStart").value = ""; $("taskEnd").value = ""; });
  // default the task due date to today
  $("taskDue").value = todayStr();

  // ---------- add-event modal (予定追加 → primary calendar) ----------
  function openEvtModal() {
    $("evtTitle").value = ""; $("evtDate").value = todayStr();
    $("evtAllday").checked = false; $("evtTimeRow").hidden = false;
    $("evtStart").value = "09:00"; $("evtEnd").value = "10:00";
    $("evtNote").hidden = true; $("evtSave").disabled = false; $("evtSave").textContent = "カレンダーに追加";
    $("evtModal").hidden = false; $("evtTitle").focus();
  }
  function closeEvtModal() { $("evtModal").hidden = true; }
  $("addEventBtn").addEventListener("click", openEvtModal);
  $("evtCancel").addEventListener("click", closeEvtModal);
  $("evtModal").addEventListener("click", function (e) { if (e.target === $("evtModal")) closeEvtModal(); });
  $("evtAllday").addEventListener("change", function () { $("evtTimeRow").hidden = $("evtAllday").checked; });
  $("evtSave").addEventListener("click", function () {
    var title = ($("evtTitle").value || "").trim();
    var date = $("evtDate").value;
    var note = $("evtNote");
    if (!title) { note.textContent = "タイトルを入力してください。"; note.hidden = false; return; }
    if (!date) { note.textContent = "日付を選んでください。"; note.hidden = false; return; }
    if (!window.__mcp) { note.textContent = "Googleに接続されていません。"; note.hidden = false; return; }
    var allDay = $("evtAllday").checked;
    var opts = { summary: title, allDay: allDay, date: date };
    if (!allDay) {
      opts.start = $("evtStart").value || "09:00";
      opts.end = $("evtEnd").value || opts.start;
    }
    note.hidden = true; $("evtSave").disabled = true; $("evtSave").textContent = "追加中…";
    gcalCreate("primary", opts).then(function () {
      if (window.__mcp && window.__mcp.invalidate) { try { window.__mcp.invalidate(CAL_SERVER); } catch (e) {} }
      closeEvtModal();
      setTimeout(function () { renderHero(); renderSchedule(); }, 600);
    }).catch(function (err) {
      $("evtSave").disabled = false; $("evtSave").textContent = "カレンダーに追加";
      note.textContent = "追加できませんでした（" + ((err && err.code) || "エラー") + "）。もう一度お試しください。";
      note.hidden = false;
    });
  });

  // ---------- sync stamp ----------
  function touchStamp() { lastMcpUpdate = Date.now(); $("stamp").textContent = "更新 " + fmtTime(new Date()); }

  // ---------- refresh (auto) ----------
  function autoRefresh() {
    if (window.__mcp && window.__mcp.invalidate) { try { window.__mcp.invalidate(); } catch (e) {} }
    dbRefresh();
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) autoRefresh(); });

  // ---------- clock (countdown refresh + day rollover) ----------
  setInterval(function () {
    renderHeader();
    var k = todayBounds().key;
    if (k !== dayKey) { dayKey = k; startWatches(); }
    renderHero();
    renderSchedule();
  }, 30000);

  // ---------- boot ----------
  renderHeader();
  renderHero();
  renderSchedule();
  renderMail();

  // tasks: render instantly from local cache, then upgrade to db when/if it connects
  todos = lsLoad();
  setSync("local");
  renderTasks();

  function mapDocs(snap) {
    // snapshot docs & data() are FROZEN — clone before touching (strict mode throws on frozen assign)
    return snap.docs.map(function (doc) {
      var src = doc.data() || {};
      return { id: doc.id, title: src.title, kind: src.kind, done: !!src.done, createdAt: src.createdAt || 0,
        due: src.due || "", dueEnd: src.dueEnd || "", dtime: src.dtime || "", dtimeEnd: src.dtimeEnd || "", eventId: src.eventId || "" };
    });
  }
  var localItems = [];
  var migrated = false;
  function migrateLocalOnce() {
    if (migrated || !db) return;
    migrated = true;
    if (localItems.length) {
      var seen = {};
      todos.forEach(function (t) { seen[(t.title || "") + "|" + (t.createdAt || 0)] = true; });
      localItems.forEach(function (li) {
        if (!li || seen[(li.title || "") + "|" + (li.createdAt || 0)]) return;
        db.collection("todos").doc().set({
          title: li.title, kind: li.kind || "task", done: !!li.done, createdAt: li.createdAt || Date.now()
        }).catch(function () {});
      });
    }
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
  }
  // one-shot authoritative read — reliable even where the realtime stream is quiet/partial on this surface
  function dbRefresh() {
    if (!db) return;
    db.collection("todos").orderBy("createdAt", "asc").get().then(function (snap) {
      usingDb = true; setSync("db");
      todos = mapDocs(snap);
      renderTasks();
      migrateLocalOnce();
    }).catch(function () {});
  }
  var refreshTimer = null;
  function dbRefreshSoon() { if (refreshTimer) return; refreshTimer = setTimeout(function () { refreshTimer = null; dbRefresh(); }, 300); }

  (async function () {
    var d = null;
    try { d = window.claude && claude.use ? await claude.use("db") : null; } catch (e) { d = null; }
    if (!d) return; // db unavailable → stay on local cache (works fully, per-device)
    db = d;
    localItems = todos.slice(); // items added before db came online
    dbRefresh(); // primary load
    // live updates (best-effort); ignore empty cache flickers so existing rows aren't wiped
    try {
      db.collection("todos").orderBy("createdAt", "asc").onSnapshot(function () {
        usingDb = true; setSync("db");
        // don't trust a possibly-partial realtime view; let the authoritative get() set contents
        dbRefreshSoon();
      }, function (err) { /* terminal db error → keep whatever we have; get() still refreshes */ });
    } catch (e) { /* onSnapshot unsupported → get()/interval keep it current */ }
    // periodic authoritative refresh for cross-device changes
    setInterval(dbRefresh, 25000);
  })();

  // mcp
  var calUnsubs = [];
  function startWatches() {
    var mcp = window.__mcp; if (!mcp) return;
    // reset calendar watches (used on day rollover too)
    calUnsubs.forEach(function (u) { try { u(); } catch (e) {} });
    calUnsubs = [];
    calEvents = {}; calStatus = {};
    var b = todayBounds();

    // gmail (once)
    if (!window.__mailWatch) {
      window.__mailWatch = mcp.watchTool(MAIL_SERVER, "search_threads",
        { query: MAIL_QUERY, pageSize: 25 },
        function (ev) {
          if (ev.type === "data") { mailData = ev.result && ev.result.payload; mailStatus = "ok"; touchStamp(); renderMail(); }
          else { mailStatus = (ev.error && ev.error.code) || "upstream_error"; renderMail(); }
        }, { refetchInterval: 90000 });
    }

    // discover calendars, then watch each
    mcp.callTool(CAL_SERVER, "list_calendars", {}).then(function (res) {
      var cals = (res && res.payload && res.payload.calendars) || [];
      // remember the タスク管理 calendar id (used when adding tasks); don't display it as a schedule
      var taskCal = cals.filter(function (c) { return (c.summary || "").trim() === TASK_CAL_NAME; })[0];
      window.__taskCalId = taskCal ? taskCal.id : "";
      var use = cals.filter(function (c) {
        return c.id && !/#holiday@/.test(c.id) && c.id.indexOf("#") < 0 && (c.summary || "").trim() !== TASK_CAL_NAME;
      });
      if (!use.length) use = [{ id: "primary", summary: "" }];
      // holiday label
      var holCal = cals.filter(function (c) { return /#holiday@/.test(c.id); })[0];
      if (holCal) fetchHoliday(holCal.id, b);
      use.forEach(function (c) {
        calNames[c.id] = c.summary || "";
        calStatus[c.id] = "load";
        var isPrimary = c.summary === GOOGLE_ACCOUNT || c.id === GOOGLE_ACCOUNT || c.id === "primary";
        var un = mcp.watchTool(CAL_SERVER, "list_events",
          { calendarId: c.id, startTime: b.startTime, endTime: b.endTime, timeZone: "Asia/Tokyo", orderBy: "startTime" },
          function (ev) {
            if (ev.type === "data") {
              var evs = (ev.result && ev.result.payload && ev.result.payload.events) || [];
              evs.forEach(function (x) { x.__cal = c.id; x.__primary = isPrimary; });
              calEvents[c.id] = evs; calStatus[c.id] = "ok"; touchStamp();
            } else {
              calStatus[c.id] = (ev.error && ev.error.code) || "upstream_error";
            }
            renderHero(); renderSchedule();
          }, { refetchInterval: 120000 });
        calUnsubs.push(un);
      });
      renderHero(); renderSchedule();
    }).catch(function (err) {
      // fall back to primary calendar only
      var code = (err && err.code) || "upstream_error";
      calStatus.__list = code;
      var un = mcp.watchTool(CAL_SERVER, "list_events",
        { calendarId: "primary", startTime: b.startTime, endTime: b.endTime, timeZone: "Asia/Tokyo", orderBy: "startTime" },
        function (ev) {
          if (ev.type === "data") {
            delete calStatus.__list;
            var evs = (ev.result && ev.result.payload && ev.result.payload.events) || [];
            evs.forEach(function (x) { x.__cal = "primary"; x.__primary = true; });
            calEvents.primary = evs; calStatus.primary = "ok"; touchStamp();
          } else { calStatus.primary = (ev.error && ev.error.code) || code; }
          renderHero(); renderSchedule();
        }, { refetchInterval: 120000 });
      calUnsubs.push(un);
    });
  }

  function fetchHoliday(id, b) {
    if (!window.__mcp) return;
    window.__mcp.callTool(CAL_SERVER, "list_events",
      { calendarId: id, startTime: b.startTime, endTime: b.endTime, timeZone: "Asia/Tokyo" }
    ).then(function (r) {
      var evs = (r && r.payload && r.payload.events) || [];
      if (evs.length && evs[0].summary) {
        var h = $("dHoliday"); h.textContent = evs[0].summary; h.hidden = false;
      }
    }).catch(function () {});
  }

  (async function () {
    var mcp = null;
    try { mcp = window.claude && claude.use ? await claude.use("mcp") : null; } catch (e) { mcp = null; }
    window.__mcpReady = true;
    if (!mcp) {
      // no live data available; show gentle connect state
      mailStatus = "server_not_connected";
      calStatus = { __na: "server_not_connected" };
      renderHero(); renderSchedule(); renderMail();
      return;
    }
    window.__mcp = mcp;
    startWatches();
  })();
})();
</script>
